# US-035: nightly retrieval-eval workflow. Runs the same 60-question
# golden set the PR workflow does, on a schedule (02:00 UTC daily) and on
# manual `workflow_dispatch`. Designed to grow into the "full sweep
# including reranker modes" the PRD calls for — the reranker portion is a
# documented TODO pending a runner extension (see notes inside the run
# step). Today's nightly covers vector / keyword / hybrid against main,
# publishing JSON + markdown snapshots under `docs/nightly/` so the
# repo has a long-running historical record.

name: Retrieval eval (nightly)

on:
  schedule:
    # 02:00 UTC daily — pick a quiet time so the run doesn't compete with
    # PR CI on the same Supabase docker stack.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  # contents: write - commit the nightly snapshot to docs/nightly/.
  # issues: write - the 'Alarm on stranded eval publish' step files / closes a
  # deduped publish-failure issue when a snapshot cannot be published to main.
  contents: write
  issues: write

concurrency:
  group: retrieval-eval-nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: Full sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # Need the full token to push the nightly snapshot back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint eval-publish app token
        id: eval_publish_app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EVAL_PUBLISH_APP_ID }}
          private-key: ${{ secrets.EVAL_PUBLISH_APP_PRIVATE_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Supabase CLI
        # Pinned to match local dev + retrieval-eval.yml: an unpinned `latest`
        # drifted to a CLI whose default auth key format breaks the eval
        # runner's self-minted JWTs (403). See retrieval-eval.yml for the full
        # rationale; keep these pins in lockstep.
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Start local Supabase stack
        run: |
          supabase start
          supabase status -o env > /tmp/supabase.env
          grep -E '^(API_URL|SERVICE_ROLE_KEY|DB_URL)=' /tmp/supabase.env \
            | sed -E 's/^(.*)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r evals/retrieval/requirements.txt

      - name: Seed corpus + run eval
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          CORPUS_SEED_DATABASE_URL: ${{ env.DB_URL }}
          DATABASE_URL: ${{ env.DB_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m db_seed.corpus_seed
          python -m evals.retrieval.runner --out /tmp/nightly.json

      - name: Publish to docs/nightly/ via auto-merging PR
        id: publish_baseline
        env:
          # PR creation + auto-merge run under the eval-publish GitHub App's
          # installation token, NOT the default GITHUB_TOKEN. A PR opened by
          # GITHUB_TOKEN does not trigger the required check workflows (GitHub
          # blocks recursive runs), so an auto-merging PR opened with it would sit
          # forever waiting on checks that never start. The App token is minted
          # fresh each run by the 'Mint eval-publish app token' step (from the
          # EVAL_PUBLISH_APP_ID / EVAL_PUBLISH_APP_PRIVATE_KEY repo secrets the
          # captain provisions), so it never expires the way the old PAT did. That
          # mint step fails loudly if the App secrets are missing/invalid, and the
          # preflight below fails loudly if the token is empty, rather than
          # silently falling back to a direct push the required-checks ruleset on
          # main would reject anyway.
          GH_TOKEN: ${{ steps.eval_publish_app_token.outputs.token }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          mkdir -p docs/nightly
          cp /tmp/nightly.json "docs/nightly/${DATE}.json"
          cp evals/retrieval/summary.md "docs/nightly/${DATE}.md"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/nightly
          if git diff --cached --quiet; then
            echo "no changes to commit — nightly is a no-op against current main"
            exit 0
          fi
          # Publish via an auto-merging docs-only PR instead of a direct push to
          # main. Once the required security-gate checks are enforced on main, a
          # direct push (no PR, no checks) is rejected; a docs-only PR trips those
          # checks as skipped=pass and merges cleanly. The branch name carries the
          # run id + attempt so concurrent / re-run nightlies never collide.
          BRANCH="eval-publish/retrieval-nightly-${DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Record the branch for the 'Alarm on stranded eval publish' step so a
          # failure below names the exact branch the snapshot is stranded on.
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git commit -m "chore(evals): nightly retrieval eval ${DATE}"
          # Push the new commit to a fresh remote branch and open the PR, then
          # rewind local main (git reset below). Not advancing the local branch is
          # what lets this workflow's SECOND publish step (reranker) start from a
          # clean main so its PR carries only its own snapshot, never this one.
          git push origin "HEAD:refs/heads/${BRANCH}"
          # Named-cause preflight: `gh pr create` authenticates with GH_TOKEN =
          # the minted eval-publish App token. If the mint step yielded an empty
          # token (missing/invalid App secrets) gh would die with the opaque "gh:
          # ... set the GH_TOKEN environment variable" (exit 4). Fail here with a
          # legible cause instead; the 'Alarm on stranded eval publish' step turns
          # it into a visible issue.
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error title=Nightly snapshot NOT published - eval-publish App token is empty::The ${DATE} nightly snapshot was committed and pushed to \`${BRANCH}\` but no auto-merging PR was opened, so it is stranded there, unpublished to main. Ensure the EVAL_PUBLISH_APP_ID / EVAL_PUBLISH_APP_PRIVATE_KEY repo secrets (the eval-publish GitHub App) are set and valid, then re-run."
            exit 1
          fi
          BODY=$(printf '%s\n' \
            "Automated docs-only eval snapshot from the \`Retrieval eval (nightly)\` workflow (run ${GITHUB_RUN_ID})." \
            '' \
            'Publishes the nightly retrieval receipts under `docs/nightly/` via an auto-merging PR instead of a direct `git push` to `main`, so the required security-gate checks on `main` are satisfied - a docs-only PR trips them as skipped=pass.' \
            '' \
            'Opened with the eval-publish GitHub App installation token so the required check workflows run; a PR opened with the default `GITHUB_TOKEN` would not trigger them. Auto-merge (squash) is enabled and it merges once checks pass.')
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(evals): nightly retrieval eval ${DATE}" \
            --body "${BODY}")
          gh pr merge --auto --squash --delete-branch "$PR_URL"
          echo "opened auto-merging PR: ${PR_URL}"
          git reset --hard HEAD~1

      - name: Reranker observability (hybrid + llm)
        id: publish_rerank
        # US-117: nightly reranker observability. Reruns the canonical hybrid
        # path with the `llm` reranker on top (the same
        # backend/main.py:_retrieve_for_agent path production uses), published
        # beside the baseline so the reranker delta is trackable over time.
        # Isolated AFTER the baseline publish with continue-on-error so an
        # OpenAI/infra failure across its ~60 extra serial calls only skips the
        # reranker artifact and NEVER blocks the critical-path baseline publish.
        # cohere/voyage are run manually in the full bake-off — methodology +
        # recommendation in docs/reranker-bakeoff.md.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          CORPUS_SEED_DATABASE_URL: ${{ env.DB_URL }}
          DATABASE_URL: ${{ env.DB_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Same minted eval-publish App token the baseline publish uses (see that
          # step's note). This step is continue-on-error, so a missing secret /
          # failed publish is logged loudly but never blocks the critical-path
          # baseline publish - exactly the isolation this observability step
          # already carries.
          GH_TOKEN: ${{ steps.eval_publish_app_token.outputs.token }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          mkdir -p docs/nightly
          # Its own --summary avoids clobbering the baseline summary.md.
          python -m evals.retrieval.runner \
            --mode hybrid --viewers full --reranker llm \
            --out "docs/nightly/${DATE}-rerank-llm.json" \
            --summary /tmp/nightly-rerank-llm.md
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/nightly
          if git diff --cached --quiet; then
            echo "no reranker changes to commit — no-op against current main"
            exit 0
          fi
          # Publish via its own auto-merging docs-only PR, separate from the
          # baseline PR so the two never share a branch. See the baseline step for
          # why publishing goes through a PR rather than a direct push to main.
          BRANCH="eval-publish/retrieval-nightly-rerank-${DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Record the branch for the 'Alarm on stranded eval publish' step.
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git commit -m "chore(evals): nightly reranker observability ${DATE}"
          # Push the commit to its own remote branch and rewind local main (below),
          # same as the baseline publish step - the two never share a branch.
          git push origin "HEAD:refs/heads/${BRANCH}"
          # Named-cause preflight (see the baseline step for the full rationale).
          # This step is continue-on-error, so the exit 1 is swallowed and never
          # blocks the critical-path baseline publish - the annotation and the
          # alarm issue are what make the stranded reranker snapshot visible.
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error title=Reranker snapshot NOT published - eval-publish App token is empty::The ${DATE} reranker-observability snapshot was committed and pushed to \`${BRANCH}\` but no auto-merging PR was opened, so it is stranded there, unpublished to main. Ensure the EVAL_PUBLISH_APP_ID / EVAL_PUBLISH_APP_PRIVATE_KEY repo secrets (the eval-publish GitHub App) are set and valid, then re-run."
            exit 1
          fi
          BODY=$(printf '%s\n' \
            "Automated docs-only reranker-observability snapshot from the \`Retrieval eval (nightly)\` workflow (run ${GITHUB_RUN_ID})." \
            '' \
            'Publishes the nightly reranker receipt under `docs/nightly/` via an auto-merging PR instead of a direct `git push` to `main`, so the required security-gate checks on `main` are satisfied - a docs-only PR trips them as skipped=pass.' \
            '' \
            'Opened with the eval-publish GitHub App installation token so the required check workflows run; a PR opened with the default `GITHUB_TOKEN` would not trigger them. Auto-merge (squash) is enabled and it merges once checks pass.')
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(evals): nightly reranker observability ${DATE}" \
            --body "${BODY}")
          gh pr merge --auto --squash --delete-branch "$PR_URL"
          echo "opened auto-merging PR: ${PR_URL}"
          git reset --hard HEAD~1

      # A red scheduled run alone is exactly what failed to alert anyone when the
      # expiring publish PAT lapsed on 2026-08-12: the failure went
      # unnoticed for a week while 17 nights of receipts piled up on stranded push
      # branches and `main` froze. Moving to a fresh-minted GitHub App token ends
      # that expiry class, but any publish failure must still be impossible to
      # miss. File a deduped, visible issue whenever a publish step above fails,
      # and auto-close it once a run publishes cleanly again. Runs under the
      # default GITHUB_TOKEN - never the minted eval-publish App token - so it can
      # file the alarm even when the App credentials are precisely what is missing;
      # it never pushes. It never fails the job on its own: a failed
      # baseline publish is already red from its step, and the reranker publish is
      # deliberately continue-on-error, so its failure must stay non-blocking.
      - name: Alarm on stranded eval publish
        if: always() && (steps.publish_baseline.outcome != 'skipped' || steps.publish_rerank.outcome != 'skipped')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE_OUTCOME: ${{ steps.publish_baseline.outcome }}
          BASELINE_BRANCH: ${{ steps.publish_baseline.outputs.branch }}
          RERANK_OUTCOME: ${{ steps.publish_rerank.outcome }}
          RERANK_BRANCH: ${{ steps.publish_rerank.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Resolve open issues carrying a label via the REST issues endpoint, NOT
          # `gh issue list --label`: the GraphQL search index it queries is only
          # eventually consistent and has silently dropped freshly-labelled issues
          # (see the sibling weekly workflows' harness-failure steps), which would
          # wedge a false alarm open. `?labels=` filters the primary store and is
          # strongly consistent; drop anything with a `pull_request` key (a PR is
          # an issue in this API) so a same-labelled PR is never mistaken for it.
          open_issue_numbers() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?labels=$1&state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | .number'
          }
          LABEL=retrieval-nightly-publish-failure
          gh label create "${LABEL}" --color B60205 \
            --description "Nightly retrieval snapshot failed to publish to main" --force || true
          stranded=""
          [ "${BASELINE_OUTCOME}" = "failure" ] && stranded="${stranded}"$'\n'"- baseline: \`${BASELINE_BRANCH:-<not pushed - failed before creating the branch>}\`"
          [ "${RERANK_OUTCOME}" = "failure" ] && stranded="${stranded}"$'\n'"- reranker: \`${RERANK_BRANCH:-<not pushed - failed before creating the branch>}\`"
          if [ -n "${stranded}" ]; then
            # A transient gh blip yields empty here, so err toward filing a
            # possibly-duplicate (self-healing) issue rather than leaving the alarm
            # unshouted (invariant 12: the path that should shout must not go quiet).
            existing=$(open_issue_numbers "${LABEL}" || true)
            if [ -z "${existing}" ]; then
              gh issue create --label "${LABEL}" \
                --title "Retrieval nightly: snapshot failed to publish to main" \
                --body "$(printf '%s\n' \
                  "A publish step in the \`Retrieval eval (nightly)\` workflow failed, so a snapshot was NOT published to \`main\`." \
                  "" \
                  "The most common cause is a failed mint of the eval-publish GitHub App token that \`gh pr create\` authenticates with - missing or invalid \`EVAL_PUBLISH_APP_ID\` / \`EVAL_PUBLISH_APP_PRIVATE_KEY\` repo secrets. Check the failing publish step's log for the \`::error::\` line naming the cause." \
                  "" \
                  "Stranded branch(es):${stranded}" \
                  "" \
                  "Fix: ensure the \`EVAL_PUBLISH_APP_ID\` / \`EVAL_PUBLISH_APP_PRIVATE_KEY\` repo secrets (the eval-publish GitHub App, installed on this repo with Contents + Pull requests read/write) are set and valid, then re-run. A re-run publishes from its own fresh branch; delete any stranded branch once its snapshot has landed on main." \
                  "" \
                  "Run log: ${RUN_URL}" \
                  "" \
                  "This issue is deduped on the \`${LABEL}\` label and auto-closes as soon as a run publishes cleanly again.")" || true
              echo "filed publish-failure issue"
            else
              echo "open publish-failure issue already exists - dedup, skipping"
            fi
          else
            # No publish step failed: the mechanism is healthy, so retract any open
            # publish-failure alarm. Non-fatal throughout - a transient gh blip here
            # must not turn a healthy publish red.
            for num in $(open_issue_numbers "${LABEL}" || true); do
              gh issue close "${num}" \
                --comment "Auto-closed: the retrieval nightly published cleanly again (${RUN_URL})." || true
              echo "auto-closed publish-failure issue #${num}"
            done
          fi

      # Complements the 'Alarm on stranded eval publish' step above, which can only
      # fire once a publish step has RUN (its condition needs an outcome !=
      # 'skipped'). A mint-step failure (missing/invalid EVAL_PUBLISH_APP_ID /
      # EVAL_PUBLISH_APP_PRIVATE_KEY) or any setup abort before the eval - supabase
      # start, pip install, the seed, a timeout kill - SKIPS both publish steps, so
      # that alarm never fires and, without this step, a red nightly would file
      # nothing (the exact silent-failure class the PR #112 guarantee exists to
      # prevent). File a deduped, visible harness-failure issue whenever the job
      # aborted before either publish step ran, and auto-close it once a run reaches
      # publish again. Runs under the default GITHUB_TOKEN - never the minted App
      # token - so it can file even when the App credentials are precisely what is
      # missing; it never pushes and never fails the job on its own.
      - name: Alarm on eval harness failure
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE_OUTCOME: ${{ steps.publish_baseline.outcome }}
          RERANK_OUTCOME: ${{ steps.publish_rerank.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # REST issues endpoint, not `gh issue list --label` (the GraphQL search
          # index is only eventually consistent and has silently dropped freshly-
          # labelled issues; see the sibling weekly workflows). Drop PRs.
          open_issue_numbers() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?labels=$1&state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | .number'
          }
          LABEL=retrieval-nightly-harness-failure
          gh label create "${LABEL}" --color B60205 \
            --description "Retrieval nightly aborted before it could publish a snapshot" --force || true
          # Both publish steps skipped => the job died before either ran. On any
          # healthy or publish-failing run at least the baseline publish executes,
          # so this is an unambiguous harness-abort signal, disjoint from the
          # stranded-publish alarm's condition above.
          if [ "${BASELINE_OUTCOME}" = "skipped" ] && [ "${RERANK_OUTCOME}" = "skipped" ]; then
            # A transient gh blip yields empty here, so err toward filing a
            # possibly-duplicate (self-healing) issue rather than leaving the alarm
            # unshouted (invariant 12: the path that should shout must not go quiet).
            existing=$(open_issue_numbers "${LABEL}" || true)
            if [ -z "${existing}" ]; then
              gh issue create --label "${LABEL}" \
                --title "Retrieval nightly: harness aborted before publishing a snapshot" \
                --body "$(printf '%s\n' \
                  "The \`Retrieval eval (nightly)\` job failed BEFORE either publish step ran, so no snapshot was produced and the 'Alarm on stranded eval publish' step never fired." \
                  "" \
                  "The most common cause is a failed mint of the eval-publish GitHub App token - missing or invalid \`EVAL_PUBLISH_APP_ID\` / \`EVAL_PUBLISH_APP_PRIVATE_KEY\` repo secrets - but any setup abort (supabase start, pip install, the seed step, or the timeout kill) lands here too. Check the earliest failing step's log." \
                  "" \
                  "Fix: ensure the \`EVAL_PUBLISH_APP_ID\` / \`EVAL_PUBLISH_APP_PRIVATE_KEY\` repo secrets (the eval-publish GitHub App, installed on this repo with Contents + Pull requests read/write) are set and valid, or address the failing setup step, then re-run." \
                  "" \
                  "Run log: ${RUN_URL}" \
                  "" \
                  "This issue is deduped on the \`${LABEL}\` label and auto-closes as soon as a run reaches its publish step again.")" || true
              echo "filed harness-failure issue"
            else
              echo "open harness-failure issue already exists - dedup, skipping"
            fi
          else
            # A publish step ran: the harness reached publish, so retract any open
            # harness-failure alarm. Non-fatal throughout - a transient gh blip here
            # must not turn a healthy run red.
            for num in $(open_issue_numbers "${LABEL}" || true); do
              gh issue close "${num}" \
                --comment "Auto-closed: the retrieval nightly reached its publish step again (${RUN_URL})." || true
              echo "auto-closed harness-failure issue #${num}"
            done
          fi
