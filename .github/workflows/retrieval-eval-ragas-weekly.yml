# US-008: weekly RAGAS-eval workflow. Runs the four canonical RAGAS metrics
# (Faithfulness, Answer Relevancy, Context Precision, Context Recall) over the
# 60-question golden set on the two hybrid pre_filter cells, on a weekly
# schedule (Sundays 04:00 UTC) and on manual `workflow_dispatch`. It keeps its
# own concurrency group and snapshot directory so it never tangles with the
# daily nightly retrieval workflow.
#
# Snapshots land under `docs/ragas-weekly/<DATE>.{json,md}` — the rolling
# history the diagnostic / score-regression gates (US-006 / US-007) compare
# against. A red gate finding (US-005 operational, or a US-007 corroborated
# score regression) makes the runner exit non-zero; this workflow then files
# one GitHub issue per finding tag and fails so a maintainer is paged. A green
# scheduled run auto-closes stale operational issues. A run that produces NO
# snapshot is a third state — UNMEASURED, not green and not red — and files its
# own deduped `ragas-weekly-harness-failure` issue rather than going quiet; see
# the snapshot check below for why that state has to exist.

name: RAGAS eval (weekly)

on:
  schedule:
    # 04:00 UTC Sundays — off-peak vs the daily nightly's 02:00 UTC so the two
    # never compete for the same Supabase docker stack.
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  # contents: write — commit the weekly snapshot to docs/ragas-weekly/.
  # issues: write — file / close gate-finding issues.
  contents: write
  issues: write

concurrency:
  group: retrieval-eval-ragas-weekly
  cancel-in-progress: false

jobs:
  weekly-ragas:
    name: Weekly RAGAS sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # Need the full token to push the weekly snapshot back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Supabase CLI
        # Pinned to match local dev + retrieval-eval.yml: an unpinned `latest`
        # drifted to a CLI whose default auth key format breaks the eval
        # runner's self-minted JWTs (403). See retrieval-eval.yml for the full
        # rationale; keep these pins in lockstep.
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Start local Supabase stack
        run: |
          supabase start
          supabase status -o env > /tmp/supabase.env
          grep -E '^(API_URL|SERVICE_ROLE_KEY|DB_URL)=' /tmp/supabase.env \
            | sed -E 's/^(.*)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # requirements.txt (not requirements-ci.txt) so `ragas` +
          # `langchain-openai` are present for the --include-ragas path.
          pip install -r evals/retrieval/requirements.txt

      - name: Seed corpus + run RAGAS eval
        id: ragas
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          CORPUS_SEED_DATABASE_URL: ${{ env.DB_URL }}
          DATABASE_URL: ${{ env.DB_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m db_seed.corpus_seed
          # `--viewers partial` expands to (full_access, partial_access) — the
          # two cells RAGAS scores; the runner has no comma-list viewer
          # syntax. `--summary` points at /tmp so the default
          # evals/retrieval/summary.md (the nightly retrieval artifact) is
          # left untouched. The runner exits 1 on a red gate finding but
          # writes the JSON + summary first, so a snapshot is publishable for
          # any failure ON THE GATE PATH. It is NOT a guarantee that a snapshot
          # exists: anything that kills the process before scoring (a bad API
          # key, a seed failure) produces none, which the snapshot check below
          # treats as its own UNMEASURED state rather than as a verdict.
          # Capture the code rather than letting it abort.
          set +e
          python -m evals.retrieval.runner \
            --include-generation --include-ragas \
            --mode hybrid --viewers partial \
            --out /tmp/ragas-weekly.json --summary /tmp/ragas-weekly.md
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          echo "runner exited ${code}"

      # The runner's "always writes a snapshot first" contract is a claim about
      # the gate path, not about the whole run: anything that kills the process
      # BEFORE scoring (an invalid ANTHROPIC_API_KEY, a seed failure, an OOM)
      # leaves no snapshot at all. That case is neither green nor red, it is
      # UNMEASURED, and it has to be named as its own state here so the steps
      # below cannot quietly treat it as either.
      - name: Check the runner produced a snapshot
        id: snapshot
        if: always()
        env:
          # Unset when the job died BEFORE the runner step (supabase start, pip
          # install, the timeout kill). Naming that as its own phrase keeps the
          # annotation from blaming the runner for a failure it never reached.
          RUNNER_EXIT: ${{ steps.ragas.outputs.exit_code }}
        run: |
          EXIT_DESC="exited ${RUNNER_EXIT}"
          LOG_HINT="the traceback is in the *Seed corpus + run RAGAS eval* step"
          if [ -z "${RUNNER_EXIT}" ]; then
            EXIT_DESC="never ran (the job failed before the run step)"
            LOG_HINT="the *Seed corpus + run RAGAS eval* step never executed, so the failure is in an earlier step"
          fi
          echo "exit_desc=${EXIT_DESC}" >> "$GITHUB_OUTPUT"
          echo "log_hint=${LOG_HINT}" >> "$GITHUB_OUTPUT"
          if [ -f /tmp/ragas-weekly.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error title=RAGAS weekly UNMEASURED::The runner ${EXIT_DESC} without writing a snapshot, so no gate was evaluated this week. This is not a red gate finding; nothing was measured."
          fi

      # Mint the eval-publish App token immediately before publishing, NOT at job
      # start: a GitHub App installation token is valid for only 1 hour, and this
      # job's timeout-minutes is 60, so a token minted at checkout could expire
      # mid-sweep and hand `gh pr create`/`gh pr merge` an expired-but-nonempty
      # token that sails past the empty-token preflight and then 401s. Minting
      # here, gated on the same snapshot-present condition the publish step uses,
      # keeps it fresh for the full publish and skips it on an UNMEASURED run.
      - name: Mint eval-publish app token
        id: eval_publish_app_token
        if: always() && steps.snapshot.outputs.present == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EVAL_PUBLISH_APP_ID }}
          private-key: ${{ secrets.EVAL_PUBLISH_APP_PRIVATE_KEY }}

      - name: Publish to docs/ragas-weekly/
        id: publish
        if: always() && steps.snapshot.outputs.present == 'true'
        env:
          # PR creation + auto-merge run under the eval-publish GitHub App's
          # installation token, NOT the default GITHUB_TOKEN. A PR opened by
          # GITHUB_TOKEN does not trigger the required check workflows (GitHub
          # blocks recursive runs), so an auto-merging PR opened with it would sit
          # forever waiting on checks that never start. The App token is minted
          # fresh each run by the 'Mint eval-publish app token' step (from the
          # EVAL_PUBLISH_APP_ID / EVAL_PUBLISH_APP_PRIVATE_KEY repo secrets the
          # captain provisions), so it never expires the way the old PAT did. That
          # mint step fails loudly if the App secrets are missing/invalid, and the
          # preflight below fails loudly if the token is empty, rather than
          # silently falling back to a direct push the required-checks ruleset on
          # main would reject anyway. (The issue-filing step below keeps the
          # default GITHUB_TOKEN - it never pushes.)
          GH_TOKEN: ${{ steps.eval_publish_app_token.outputs.token }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          mkdir -p docs/ragas-weekly
          cp /tmp/ragas-weekly.json "docs/ragas-weekly/${DATE}.json"
          cp /tmp/ragas-weekly.md "docs/ragas-weekly/${DATE}.md"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/ragas-weekly
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          # Publish via an auto-merging docs-only PR instead of a direct push to
          # main. Once the required security-gate checks are enforced on main, a
          # direct push (no PR, no checks) is rejected; a docs-only PR trips those
          # checks as skipped=pass and merges cleanly. The branch name carries the
          # run id + attempt so concurrent / re-run runs never collide.
          BRANCH="eval-publish/ragas-weekly-${DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Record the branch for the 'Alarm on stranded eval publish' step so a
          # failure below names the exact branch the snapshot is stranded on.
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git commit -m "chore(evals): weekly RAGAS eval ${DATE}"
          # Push the commit to a fresh remote branch and rewind local main (below),
          # leaving the checkout clean.
          git push origin "HEAD:refs/heads/${BRANCH}"
          # Named-cause preflight: `gh pr create` authenticates with GH_TOKEN =
          # the minted eval-publish App token. If the mint step yielded an empty
          # token (missing/invalid App secrets) gh would die with the opaque "gh:
          # ... set the GH_TOKEN environment variable" (exit 4). Fail here with a
          # legible cause instead; the 'Alarm on stranded eval publish' step turns
          # it into a visible issue.
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error title=RAGAS weekly snapshot NOT published - eval-publish App token is empty::The ${DATE} RAGAS snapshot was committed and pushed to \`${BRANCH}\` but no auto-merging PR was opened, so it is stranded there, unpublished to main. Ensure the EVAL_PUBLISH_APP_ID / EVAL_PUBLISH_APP_PRIVATE_KEY repo secrets (the eval-publish GitHub App) are set and valid, then re-run."
            exit 1
          fi
          BODY=$(printf '%s\n' \
            "Automated docs-only eval snapshot from the \`RAGAS eval (weekly)\` workflow (run ${GITHUB_RUN_ID})." \
            '' \
            'Publishes the weekly RAGAS receipts under `docs/ragas-weekly/` via an auto-merging PR instead of a direct `git push` to `main`, so the required security-gate checks on `main` are satisfied - a docs-only PR trips them as skipped=pass.' \
            '' \
            'Opened with the eval-publish GitHub App installation token so the required check workflows run; a PR opened with the default `GITHUB_TOKEN` would not trigger them. Auto-merge (squash) is enabled and it merges once checks pass.')
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(evals): weekly RAGAS eval ${DATE}" \
            --body "${BODY}")
          gh pr merge --auto --squash --delete-branch "$PR_URL"
          echo "opened auto-merging PR: ${PR_URL}"
          git reset --hard HEAD~1

      # Distinct from the harness-failure step below (which fires when NO snapshot
      # was produced): this fires when a snapshot WAS produced but could not be
      # PUBLISHED to main - the exact failure mode of the 2026-08-12 PAT lapse,
      # which stranded receipts on push branches unnoticed for a week. The move to
      # a fresh-minted GitHub App token ends that expiry class, but any publish
      # failure must still be caught. File a deduped, visible issue on a publish
      # failure and auto-close it once a run publishes cleanly again. Runs under the
      # default GITHUB_TOKEN - never the minted eval-publish App token - so it can
      # file the alarm even when the App credentials are precisely what is missing;
      # it never pushes. It never fails the job on its own: a failed publish is
      # already red from the step above.
      - name: Alarm on stranded eval publish
        if: always() && steps.publish.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STRANDED_BRANCH: ${{ steps.publish.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # REST issues endpoint, not `gh issue list --label` (the GraphQL search
          # index is only eventually consistent and has silently dropped freshly-
          # labelled issues; see the harness-failure step below). Drop PRs.
          open_issue_numbers() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?labels=$1&state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | .number'
          }
          LABEL=ragas-weekly-publish-failure
          gh label create "${LABEL}" --color B60205 \
            --description "RAGAS weekly snapshot failed to publish to main" --force || true
          if [ "${PUBLISH_OUTCOME}" = "failure" ]; then
            # A transient gh blip yields empty here, so err toward filing a
            # possibly-duplicate (self-healing) issue rather than leaving the alarm
            # unshouted (invariant 12: the path that should shout must not go quiet).
            existing=$(open_issue_numbers "${LABEL}" || true)
            if [ -z "${existing}" ]; then
              gh issue create --label "${LABEL}" \
                --title "RAGAS weekly: snapshot failed to publish to main" \
                --body "$(printf '%s\n' \
                  "The \`RAGAS eval (weekly)\` publish step failed, so this week's snapshot was produced but NOT published to \`main\`." \
                  "" \
                  "The most common cause is a failed mint of the eval-publish GitHub App token that \`gh pr create\` authenticates with - missing or invalid \`EVAL_PUBLISH_APP_ID\` / \`EVAL_PUBLISH_APP_PRIVATE_KEY\` repo secrets. Check the publish step's log for the \`::error::\` line naming the cause." \
                  "" \
                  "Stranded branch: \`${STRANDED_BRANCH:-<not pushed - the publish step failed before creating the branch>}\`" \
                  "" \
                  "Fix: ensure the \`EVAL_PUBLISH_APP_ID\` / \`EVAL_PUBLISH_APP_PRIVATE_KEY\` repo secrets (the eval-publish GitHub App, installed on this repo with Contents + Pull requests read/write) are set and valid, then re-run. A re-run publishes from its own fresh branch; delete any stranded branch once its snapshot has landed on main." \
                  "" \
                  "Run log: ${RUN_URL}" \
                  "" \
                  "This issue is deduped on the \`${LABEL}\` label and auto-closes as soon as a run publishes cleanly again.")" || true
              echo "filed publish-failure issue"
            else
              echo "open publish-failure issue already exists - dedup, skipping"
            fi
          else
            # Publish succeeded (or was a clean no-op): the mechanism is healthy, so
            # retract any open publish-failure alarm. Non-fatal throughout.
            for num in $(open_issue_numbers "${LABEL}" || true); do
              gh issue close "${num}" \
                --comment "Auto-closed: the RAGAS weekly published cleanly again (${RUN_URL})." || true
              echo "auto-closed publish-failure issue #${num}"
            done
          fi

      # A missing snapshot IS a finding, and the loudest one this workflow can
      # produce - it means the gates went unmeasured. The old `exit 0` here is
      # what kept this workflow silent for nine consecutive weekly failures
      # (2026-05-24 through 2026-07-26, an invalid ANTHROPIC_API_KEY 401'ing the
      # judge before any scoring): the publish step found nothing to publish,
      # this step found nothing to read, and the only surviving signal was a red
      # X captioned "a red gate finding fired" - describing the very thing that
      # had NOT happened. The path that should shout must never be the path that
      # goes quiet.
      - name: File / close gate-finding issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_EXIT: ${{ steps.ragas.outputs.exit_code }}
          EXIT_DESC: ${{ steps.snapshot.outputs.exit_desc }}
          LOG_HINT: ${{ steps.snapshot.outputs.log_hint }}
          EVENT_NAME: ${{ github.event_name }}
          SNAPSHOT: ${{ steps.snapshot.outputs.present }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Resolve open issues carrying a label via the REST issues endpoint,
          # NOT `gh issue list --label`. `gh issue list` queries the GraphQL
          # SEARCH index, which is only eventually consistent with the labels on
          # an issue — it silently omitted a freshly-labelled harness issue for
          # over a day (see #94 in the sibling E7 weekly), so the snapshot-
          # producing run that should have auto-closed it listed zero matches and
          # closed nothing, wedging a false UNMEASURED alarm open forever. The
          # `repos/:owner/:repo/issues?labels=` endpoint filters against the
          # primary store and is strongly consistent, so the retract-the-alarm
          # path can no longer go quiet. `?labels=` also returns PRs (a PR is an
          # issue in the API), so drop anything with a `pull_request` key.
          open_issue_numbers() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?labels=$1&state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | .number'
          }
          HARNESS_LABEL=ragas-weekly-harness-failure
          if [ "${SNAPSHOT}" != "true" ]; then
            gh label create "${HARNESS_LABEL}" --color B60205 \
              --description "RAGAS weekly harness died before producing a snapshot" --force || true
            # A transient gh api blip yields empty here, so err toward filing a
            # possibly-duplicate (self-healing) issue rather than aborting and
            # leaving the UNMEASURED alarm unshouted (invariant 12: the path that
            # should shout must never go quiet).
            existing=$(open_issue_numbers "${HARNESS_LABEL}" || true)
            if [ -z "${existing}" ]; then
              gh issue create --label "${HARNESS_LABEL}" \
                --title "RAGAS weekly: no snapshot produced — the gates are UNMEASURED" \
                --body "$(printf '%s\n' \
                  "The weekly RAGAS runner ${EXIT_DESC} without writing \`/tmp/ragas-weekly.json\`." \
                  "" \
                  "**No gate was evaluated this week.** This is not a green run and not a red one - it is an unmeasured one, and every RAGAS number the repo reports is as old as the last run that did produce a snapshot." \
                  "" \
                  "Nothing was published to \`docs/ragas-weekly/\`, so the newest file there is stale and must not be read as current." \
                  "" \
                  "Run log (${LOG_HINT}): ${RUN_URL}" \
                  "" \
                  "This issue is deduped on the \`${HARNESS_LABEL}\` label and auto-closes as soon as a run produces a snapshot again.")"
              echo "filed harness-failure issue"
            else
              echo "open harness-failure issue already exists - dedup, skipping"
            fi
            exit 1
          fi
          # A snapshot exists, so the harness is measuring again: clear any open
          # harness-failure issue before dealing with the gate verdict itself.
          # Unlike the gate-finding auto-close below this is NOT restricted to
          # scheduled runs - "did the harness produce a snapshot" is a fact about
          # this run alone, not a verdict a partial re-run could misrepresent.
          #
          # Both the label creation and the list are non-fatal: this branch runs
          # on every MEASURED run, so a never-yet-created label or a transient gh
          # blip here must not turn a fully-measured green run red - that is the
          # exact miscaption this step exists to remove.
          gh label create "${HARNESS_LABEL}" --color B60205 \
            --description "RAGAS weekly harness died before producing a snapshot" --force || true
          for num in $(open_issue_numbers "${HARNESS_LABEL}" || true); do
            gh issue close "${num}" \
              --comment "Auto-closed: the RAGAS weekly harness produced a snapshot again (${RUN_URL}), so the gates are being measured."
            echo "auto-closed harness-failure issue #${num}"
          done
          if [ "${RUNNER_EXIT}" != "0" ]; then
            # Red gate finding(s): file one issue per tag, deduped against an
            # open issue already carrying that label.
            tags=$(jq -r '.ragas.gate_findings // []
              | map(select(.severity == "red")) | map(.tag) | unique | .[]' \
              /tmp/ragas-weekly.json)
            for tag in ${tags}; do
              gh label create "${tag}" --color B60205 \
                --description "RAGAS weekly gate finding" --force || true
              # A transient gh api blip yields empty here, so err toward filing a
              # possibly-duplicate (self-healing) gate issue rather than aborting
              # and leaving the gate finding unshouted (invariant 12: the path
              # that should shout must never go quiet).
              existing=$(open_issue_numbers "${tag}" || true)
              if [ -z "${existing}" ]; then
                body=$(jq -r --arg t "${tag}" '.ragas.gate_findings
                  | map(select(.tag == $t))
                  | map("- " + .message) | join("\n")' /tmp/ragas-weekly.json)
                gh issue create --label "${tag}" \
                  --title "RAGAS weekly gate: ${tag}" \
                  --body "${body}"
                echo "filed issue for ${tag}"
              else
                echo "open issue already exists for ${tag} — dedup, skipping"
              fi
            done
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            # Green scheduled run: auto-close stale operational issues. Only a
            # scheduled run auto-closes — a manual dispatch may be a partial
            # re-run and must not clear a still-real finding.
            for tag in coverage-pipeline-failure coverage-operational-failure; do
              for num in $(open_issue_numbers "${tag}" || true); do
                gh issue close "${num}" \
                  --comment "Auto-closed: the scheduled weekly RAGAS run was green (no ${tag})."
                echo "auto-closed issue #${num} (${tag})"
              done
            done
          fi

      # Gated on the snapshot as well as the exit code: without one there is no
      # gate verdict to reflect, and claiming "a red gate finding fired" for a
      # harness crash is what made nine weeks of failures look like nine weeks of
      # findings. That case fails the job from the issue step above instead.
      - name: Reflect runner exit code
        if: always() && steps.snapshot.outputs.present == 'true' && steps.ragas.outputs.exit_code == '1'
        run: |
          echo "RAGAS runner exited 1 — a red gate finding fired."
          echo "Findings have been filed as GitHub issues; failing the workflow."
          exit 1
