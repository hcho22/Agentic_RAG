# US-059: weekly E7 escalation-eval workflow. Runs the FULL deflection-pipeline
# eval — the deterministic P1a/P1b legs PLUS the LLM-judged P2/P3 legs and the
# knob sweep (deflection-vs-false-resolve curve + knee) — on a weekly schedule and
# on manual `workflow_dispatch`. The LLM-judged legs draft answers and score their
# faithfulness with the OFFLINE cross-family Claude judge, so they belong here
# (scheduled) and NEVER on the per-PR path: a judge wobble must not red-bar an
# innocent merge. The deterministic P1a/P1b retrieval-gate tripwire + the US-058
# non-disclosure assertion ALSO run per-PR (retrieval-eval.yml) and block merge
# there; here they run again as part of the full sweep.
#
# CI placement (US-059 AC3):
#   * The false-resolve ceiling (the buyer's risk number,
#     ESCALATION_FALSE_RESOLVE_CEILING) is a PINNED SAFETY invariant: a measured
#     faithfulness-leg (P3) false-resolve rate above it exits the runner non-zero,
#     fails THIS workflow, and files an issue. It is never downgraded to a comment.
#     That faithfulness leg IS the gated rate and is only scored here, so it carries
#     an accepted up-to-a-week detection latency (documented in docs/evals.md "E7 CI
#     placement"; mitigated by the per-PR retrieval-leg tripwire, which hard-fails
#     unconditionally on any P1a/P1b retrieval-leg false-resolve immediately).
#     Because that ceiling is fed SOLELY by P3, a P3 leg that never EXERCISES the
#     faithfulness gate ALSO exits the runner non-zero. The P3 positive control
#     requires >=1 row to actually reach a faithfulness verdict (clear retrieval,
#     draft, get judged), closing BOTH disarm paths gold drift could open: an empty
#     P3 leg (rate None, unmeasured) AND a non-empty but entirely-mislabeled one
#     (every row escalates before the gate -> a vacuous measured 0% that never
#     breaches). It fails closed so neither can leave the safety invariant silently
#     unmeasured (mirrors the P1a/P1b/non-disclosure blindness guards; the exit-code
#     decision is e7_pinned_invariants_failed).
#   * The tunable quality metrics (deflection / false-escalate) are reported in the
#     snapshot but do NOT fail the run — the configurable E8 gate (Area F) governs
#     comment-vs-fail on those; until E8 lands they are advisory here.
#
# Snapshots land under `docs/escalation-weekly/<DATE>.{json,md}` — a rolling
# history. A red verdict files one deduped GitHub issue and fails the workflow so a
# maintainer is paged; a green scheduled run auto-closes stale gate issues. A run
# that produces NO snapshot is a third state — UNMEASURED, not green and not red —
# and files its own deduped `e7-weekly-harness-failure` issue rather than going
# quiet; see the snapshot check below for why that state has to exist. Keeps
# its own concurrency group + snapshot dir so it never tangles with the daily
# nightly retrieval workflow or the weekly RAGAS workflow.

name: Escalation eval (weekly)

on:
  schedule:
    # 06:00 UTC Sundays — staggered off the nightly retrieval (02:00 UTC) and the
    # weekly RAGAS (04:00 UTC) so the three never compete for runner resources.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  # contents: write — commit the weekly snapshot to docs/escalation-weekly/.
  # issues: write — file / close gate-finding issues.
  contents: write
  issues: write

concurrency:
  group: escalation-eval-weekly
  cancel-in-progress: false

jobs:
  weekly-escalation:
    name: Weekly E7 deflection sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          # Need the full token to push the weekly snapshot back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Supabase CLI
        # Pinned to match local dev + retrieval-eval.yml + the weekly RAGAS
        # workflow: an unpinned `latest` drifted to a CLI whose default auth key
        # format breaks the eval runner's self-minted JWTs (403). See
        # retrieval-eval.yml for the full rationale; keep these pins in lockstep.
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Start local Supabase stack
        run: |
          supabase start
          # Surface the stack's coordinates. ANON_KEY + JWT_SECRET are surfaced
          # (not just SERVICE_ROLE_KEY) because e7_runner mints authenticated
          # viewer JWTs and calls match_chunks under them — the corpus owner (P1a)
          # and the no-access viewer (P1b) — exactly like retrieval-eval.yml, so it
          # needs the running stack's real JWT secret + anon apikey rather than the
          # runner's baked-in local-dev fallbacks.
          supabase status -o env > /tmp/supabase.env
          grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|JWT_SECRET|DB_URL)=' /tmp/supabase.env \
            | sed -E 's/^(.*)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # requirements.txt (not requirements-ci.txt) so `anthropic` is present
          # for the OFFLINE cross-family Claude faithfulness judge the P2/P3 legs
          # + the sweep use.
          pip install -r evals/retrieval/requirements.txt

      - name: Seed corpus + run full E7 sweep
        id: e7
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_JWT_SECRET: ${{ env.JWT_SECRET }}
          CORPUS_SEED_DATABASE_URL: ${{ env.DB_URL }}
          DATABASE_URL: ${{ env.DB_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m db_seed.corpus_seed
          # The FULL sweep: deterministic P1a + P1b (+ the US-058 non-disclosure
          # assertion) AND the LLM-judged P2/P3 legs + the knob sweep. The runner
          # exits 1 on any PINNED safety invariant — a P1a/P1b gate clear, a
          # non-disclosure byte mismatch, or a consolidated false-resolve rate above
          # the buyer's ceiling — but writes the JSON + markdown FIRST, so a snapshot
          # is publishable for any failure ON THE GATE PATH. It is NOT a guarantee
          # that a snapshot exists: anything that kills the process before scoring
          # (a bad API key, a seed failure) produces none, which the snapshot check
          # below treats as its own UNMEASURED state rather than as a verdict.
          # Capture the code rather than aborting.
          # stdout (the rendered markdown report) is tee'd to the .md snapshot;
          # logging goes to stderr and stays in the workflow log.
          set +e
          python -m evals.retrieval.e7_runner \
            --include-p1b --include-p2 --include-p3 --sweep \
            --out /tmp/e7-weekly.json | tee /tmp/e7-weekly.md
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          echo "runner exited ${code}"

      # The runner's "always writes the snapshot FIRST" contract covers the gate
      # path, not the whole run: anything that kills the process BEFORE scoring
      # (an invalid ANTHROPIC_API_KEY, a seed failure, an OOM) leaves no snapshot
      # at all. That case is neither green nor red, it is UNMEASURED, and it has
      # to be named as its own state here so the steps below cannot quietly
      # treat it as either.
      - name: Check the runner produced a snapshot
        id: snapshot
        if: always()
        env:
          # Unset when the job died BEFORE the runner step (supabase start, pip
          # install, the timeout kill). Naming that as its own phrase keeps the
          # annotation from blaming the runner for a failure it never reached.
          RUNNER_EXIT: ${{ steps.e7.outputs.exit_code }}
        run: |
          EXIT_DESC="exited ${RUNNER_EXIT}"
          LOG_HINT="the traceback is in the *Seed corpus + run full E7 sweep* step"
          if [ -z "${RUNNER_EXIT}" ]; then
            EXIT_DESC="never ran (the job failed before the run step)"
            LOG_HINT="the *Seed corpus + run full E7 sweep* step never executed, so the failure is in an earlier step"
          fi
          echo "exit_desc=${EXIT_DESC}" >> "$GITHUB_OUTPUT"
          echo "log_hint=${LOG_HINT}" >> "$GITHUB_OUTPUT"
          if [ -f /tmp/e7-weekly.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error title=E7 weekly UNMEASURED::The runner ${EXIT_DESC} without writing a snapshot, so no pinned safety invariant was evaluated this week. This is not a gate finding; nothing was measured."
          fi

      - name: Publish to docs/escalation-weekly/
        if: always() && steps.snapshot.outputs.present == 'true'
        env:
          # PR creation + auto-merge run under the fine-grained PAT, NOT the default
          # GITHUB_TOKEN. A PR opened by GITHUB_TOKEN does not trigger the required
          # check workflows (GitHub blocks recursive runs), so an auto-merging PR
          # opened with it would sit forever waiting on checks that never start.
          # The PAT (Contents + Pull requests read/write) is provisioned by the
          # captain as the EVAL_PUBLISH_TOKEN repo secret; a missing secret fails
          # this step loudly rather than silently falling back to a direct push that
          # the required-checks ruleset on main would reject anyway. (The issue-
          # filing step below keeps the default GITHUB_TOKEN - it never pushes.)
          GH_TOKEN: ${{ secrets.EVAL_PUBLISH_TOKEN }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          mkdir -p docs/escalation-weekly
          cp /tmp/e7-weekly.json "docs/escalation-weekly/${DATE}.json"
          cp /tmp/e7-weekly.md "docs/escalation-weekly/${DATE}.md"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/escalation-weekly
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          # Publish via an auto-merging docs-only PR instead of a direct push to
          # main. Once the required security-gate checks are enforced on main, a
          # direct push (no PR, no checks) is rejected; a docs-only PR trips those
          # checks as skipped=pass and merges cleanly. The branch name carries the
          # run id + attempt so concurrent / re-run runs never collide.
          BRANCH="eval-publish/escalation-weekly-${DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git commit -m "chore(evals): weekly E7 escalation eval ${DATE}"
          # Push the commit to a fresh remote branch and rewind local main (below),
          # leaving the checkout clean.
          git push origin "HEAD:refs/heads/${BRANCH}"
          BODY=$(printf '%s\n' \
            "Automated docs-only eval snapshot from the \`Escalation eval (weekly)\` workflow (run ${GITHUB_RUN_ID})." \
            '' \
            'Publishes the weekly E7 escalation receipts under `docs/escalation-weekly/` via an auto-merging PR instead of a direct `git push` to `main`, so the required security-gate checks on `main` are satisfied - a docs-only PR trips them as skipped=pass.' \
            '' \
            'Opened with the `EVAL_PUBLISH_TOKEN` fine-grained PAT so the required check workflows run; a PR opened with the default `GITHUB_TOKEN` would not trigger them. Auto-merge (squash) is enabled and it merges once checks pass.')
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(evals): weekly E7 escalation eval ${DATE}" \
            --body "${BODY}")
          gh pr merge --auto --squash "$PR_URL"
          echo "opened auto-merging PR: ${PR_URL}"
          git reset --hard HEAD~1

      # A missing snapshot IS a finding, and the most serious one this workflow
      # can produce: the false-resolve ceiling is fed SOLELY by the P3 leg scored
      # here, so no snapshot means the buyer's Risk #3 safety number went
      # unmeasured for the week. The old `exit 0` is why this workflow has never
      # filed a single issue - every scheduled run since 2026-06-28 failed on an
      # invalid ANTHROPIC_API_KEY (401) before any scoring, so the publish step
      # found nothing to publish, this step found nothing to read, and the only
      # surviving signal was a red X captioned "a pinned safety invariant fired"
      # describing the very thing that had NOT been evaluated. The path that
      # should shout must never be the path that goes quiet.
      - name: File / close gate-finding issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_EXIT: ${{ steps.e7.outputs.exit_code }}
          EXIT_DESC: ${{ steps.snapshot.outputs.exit_desc }}
          LOG_HINT: ${{ steps.snapshot.outputs.log_hint }}
          EVENT_NAME: ${{ github.event_name }}
          SNAPSHOT: ${{ steps.snapshot.outputs.present }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Resolve open issues carrying a label via the REST issues endpoint,
          # NOT `gh issue list --label`. `gh issue list` queries the GraphQL
          # SEARCH index, which is only eventually consistent with the labels on
          # an issue — it silently omitted the freshly-labelled harness issue #94
          # for over a day, so the snapshot-producing run that should have
          # auto-closed it (the whole point of the "measuring again" branch)
          # listed zero matches and closed nothing, wedging a false UNMEASURED
          # alarm open forever. The `repos/:owner/:repo/issues?labels=` endpoint
          # filters against the primary store and is strongly consistent, so the
          # retract-the-alarm path can no longer go quiet. `?labels=` also returns
          # PRs (a PR is an issue in the API), so drop anything with a
          # `pull_request` key — these labels only ever land on issues, but a
          # same-labelled PR must not be mistaken for the finding.
          open_issue_numbers() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?labels=$1&state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | .number'
          }
          HARNESS_LABEL=e7-weekly-harness-failure
          if [ "${SNAPSHOT}" != "true" ]; then
            gh label create "${HARNESS_LABEL}" --color B60205 \
              --description "E7 weekly harness died before producing a snapshot" --force || true
            # A transient gh api blip yields empty here, so err toward filing a
            # possibly-duplicate (self-healing) issue rather than aborting and
            # leaving the UNMEASURED alarm unshouted (invariant 12: the path that
            # should shout must never go quiet).
            existing=$(open_issue_numbers "${HARNESS_LABEL}" || true)
            if [ -z "${existing}" ]; then
              gh issue create --label "${HARNESS_LABEL}" \
                --title "E7 weekly: no snapshot produced — the safety invariants are UNMEASURED" \
                --body "$(printf '%s\n' \
                  "The weekly E7 runner ${EXIT_DESC} without writing \`/tmp/e7-weekly.json\`." \
                  "" \
                  "**No pinned safety invariant was evaluated this week.** That includes the false-resolve ceiling (the Risk #3 buyer number), which is fed SOLELY by the P3 leg scored in this workflow - so it is not green, it is unknown, and it stays unknown until a run produces a snapshot." \
                  "" \
                  "Nothing was published to \`docs/escalation-weekly/\`. The per-PR deterministic P1a/P1b tripwire in \`retrieval-eval.yml\` is unaffected and still blocks merges." \
                  "" \
                  "Run log (${LOG_HINT}): ${RUN_URL}" \
                  "" \
                  "This issue is deduped on the \`${HARNESS_LABEL}\` label and auto-closes as soon as a run produces a snapshot again.")"
              echo "filed harness-failure issue"
            else
              echo "open harness-failure issue already exists — dedup, skipping"
            fi
            exit 1
          fi
          LABEL=e7-weekly-gate
          # A snapshot exists, so the harness is measuring again: clear any open
          # harness-failure issue before dealing with the gate verdict itself.
          # Unlike the gate auto-close below this is NOT restricted to scheduled
          # runs - "did the harness produce a snapshot" is a fact about this run
          # alone, not a verdict a partial re-run could misrepresent.
          #
          # Both the label creation and the list are non-fatal: this branch runs
          # on every MEASURED run, so a never-yet-created label or a transient gh
          # blip here must not turn a fully-measured green run red - that is the
          # exact miscaption this step exists to remove.
          gh label create "${HARNESS_LABEL}" --color B60205 \
            --description "E7 weekly harness died before producing a snapshot" --force || true
          for num in $(open_issue_numbers "${HARNESS_LABEL}" || true); do
            gh issue close "${num}" \
              --comment "Auto-closed: the E7 weekly harness produced a snapshot again (${RUN_URL}), so the safety invariants are being measured."
            echo "auto-closed harness-failure issue #${num}"
          done
          if [ "${RUNNER_EXIT}" != "0" ]; then
            # A pinned safety invariant fired. Build a body naming which one(s),
            # straight off the result JSON, then dedup against an open issue.
            body=$(jq -r '
              [
                (if .e7_false_resolve_ceiling.breached then
                  "- **False-resolve ceiling breach** (the Risk #3 safety number): measured "
                  + ((.e7_false_resolve_ceiling.rate * 100 | floor | tostring) + "%")
                  + " (" + (.e7_false_resolve_ceiling.numerator|tostring) + "/"
                  + (.e7_false_resolve_ceiling.denominator|tostring) + ") exceeds the buyer ceiling "
                  + ((.e7_false_resolve_ceiling.ceiling * 100 | floor | tostring) + "%")
                  + " (ESCALATION_FALSE_RESOLVE_CEILING)."
                else empty end),
                (if (.e7_p1a.passed == false) then
                  "- **P1a retrieval-gate regression**: no-context row(s) cleared the gate (would draft): "
                  + ((.e7_p1a.cleared_gate // []) | join(", "))
                else empty end),
                (if (.e7_p1b.passed == false) then
                  "- **P1b no-access leak**: gold reached a no-access viewer (cleared the gate): "
                  + ((.e7_p1b.cleared_gate // []) | join(", "))
                else empty end),
                (if (.e7_p1b_non_disclosure.passed == false) then
                  "- **P1b non-disclosure leak**: a no-access customer output differs from the generic deferral ("
                  + ((.e7_p1b_non_disclosure.n_leaks // 0)|tostring) + " row(s))."
                else empty end)
              ] | join("\n")
            ' /tmp/e7-weekly.json)
            if [ -z "${body}" ]; then
              body="- The runner exited ${RUNNER_EXIT} on a pinned safety invariant; see the attached snapshot."
            fi
            footer="Full report - docs/escalation-weekly/$(date -u +%Y-%m-%d).md. This is the scheduled weekly E7 sweep (US-059); it does not block merges, but a pinned safety invariant fired."
            body="${body}"$'\n\n'"${footer}"
            gh label create "${LABEL}" --color B60205 \
              --description "E7 weekly escalation gate finding" --force || true
            # A transient gh api blip yields empty here, so err toward filing a
            # possibly-duplicate (self-healing) gate issue rather than aborting and
            # leaving the gate finding unshouted (invariant 12: the path that
            # should shout must never go quiet).
            existing=$(open_issue_numbers "${LABEL}" || true)
            if [ -z "${existing}" ]; then
              gh issue create --label "${LABEL}" \
                --title "E7 weekly escalation gate: pinned safety invariant fired" \
                --body "${body}"
              echo "filed E7 weekly gate issue"
            else
              echo "open E7 weekly gate issue already exists — dedup, skipping"
            fi
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            # Green scheduled run: auto-close stale gate issues. Only a scheduled
            # run auto-closes — a manual dispatch may be a partial re-run and must
            # not clear a still-real finding.
            for num in $(open_issue_numbers "${LABEL}"); do
              gh issue close "${num}" \
                --comment "Auto-closed: the scheduled weekly E7 sweep was green (no pinned safety invariant fired)."
              echo "auto-closed issue #${num}"
            done
          fi

      # Gated on the snapshot as well as the exit code: without one there is no
      # verdict to reflect, and captioning a harness crash "a pinned safety
      # invariant fired" is what made every failure since 2026-06-28 read as a
      # finding. That case fails the job from the issue step above instead.
      - name: Reflect runner exit code
        if: always() && steps.snapshot.outputs.present == 'true' && steps.e7.outputs.exit_code == '1'
        run: |
          echo "E7 runner exited 1 — a pinned safety invariant fired (false-resolve"
          echo "ceiling breach, a P3 leg that never exercised the faithfulness gate"
          echo "(empty or all-mislabeled), a P1a/P1b gate clear, or a non-disclosure"
          echo "mismatch)."
          echo "The finding has been filed as a GitHub issue; failing the workflow."
          exit 1
