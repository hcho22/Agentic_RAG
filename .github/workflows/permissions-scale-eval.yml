# US-043: nightly permissions-scale benchmark.
#
# Runs the wikipedia 10k-chunk corpus + the ef_search sweep across three
# permission selectivities (50% / 10% / 1%). The eval is the empirical
# backing for the HNSW selectivity story in docs/permissions-aware-rag.md
# (US-044). Comment + dashboard rather than blocking PR check — the
# runtime (~3 min seed + ~3 min eval) and the OpenAI embedding cost
# (~$0.10 per seed) make it a nightly job, not a per-PR one.
#
# Failure semantics: the runner is invoked with --enforce-floor, so it
# exits non-zero if recall@5 at (selectivity=1%, ef_search=40) drops
# below the floor configured in scale_gold.yaml::recall_floor. The floor
# is intentionally loose at v0 (0.10) — the recall *collapse* is the
# whole point of the eval, so the alarm is "we still retrieve something",
# not "we retrieve everything". Tighten once three nightlies have run
# and a stable baseline is visible (PRD open question).
#

name: Permissions scale eval (nightly)

on:
  schedule:
    # 03:00 UTC daily — staggered an hour past the retrieval-eval nightly
    # so the two don't compete for the same Supabase docker stack on the
    # GitHub-hosted runner.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  # Need write access to push the nightly snapshot under
  # docs/permissions-scale-nightly/.
  contents: write

concurrency:
  group: permissions-scale-eval-nightly
  cancel-in-progress: false

jobs:
  scale:
    name: Wikipedia 10k + ef_search sweep
    runs-on: ubuntu-latest
    # Budget breakdown: seed ≈ 3 min (HF download + embedding 10k chunks
    # via OpenAI), eval ≈ 3 min (15 questions × 3 viewers × 4 ef_search
    # = 180 RPC calls), plus Supabase boot. 30-minute ceiling leaves
    # plenty of headroom for slow-day OpenAI / HuggingFace.
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evals/permissions_scale/requirements.txt

      - name: Install Supabase CLI
        # Pinned to match local dev + retrieval-eval.yml: an unpinned `latest`
        # drifted to a CLI whose default auth key format breaks the eval
        # runner's self-minted JWTs (403). See retrieval-eval.yml for the full
        # rationale; keep these pins in lockstep.
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Start local Supabase stack
        run: |
          # Brings up pgvector + PostgREST + auth + applies migrations.
          # The HNSW index on chunks.embedding is created by the same
          # migration the production schema uses, so the ef_search knob
          # behaves identically here to a real deployment.
          supabase start
          supabase status -o env > /tmp/supabase.env
          grep -E '^(API_URL|SERVICE_ROLE_KEY|DB_URL)=' /tmp/supabase.env \
            | sed -E 's/^(.*)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r evals/permissions_scale/requirements.txt

      - name: Seed wikipedia corpus
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          CORPUS_SEED_DATABASE_URL: ${{ env.DB_URL }}
          DATABASE_URL: ${{ env.DB_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Pinning here so the dataset is reproducible across runs even
          # if Salesforce/wikitext's main branch moves. Bump after the
          # first successful nightly resolves a SHA into the summary.
          WIKITEXT_REVISION: main
        run: |
          python -m db_seed.wikipedia_seed

      - name: Run scale eval
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          CORPUS_SEED_DATABASE_URL: ${{ env.DB_URL }}
          DATABASE_URL: ${{ env.DB_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # --enforce-floor: exit non-zero if the recall_floor cell in
          # scale_gold.yaml drops below threshold. Dataset-fetch / seed
          # errors fall through the `set -e` shell default and also fail
          # the job.
          # The runner has a second, semantically different non-zero exit:
          # it REFUSES a run that produced no signal (blind gold cell,
          # unseeded corpus) and writes a DEGENERATE RUN notice in place
          # of the table.
          #
          # Triaging a red nightly: the discriminator is the NOTICE HEADING
          # in the published <DATE>.md, not the presence or absence of
          # <DATE>.json. Three cases:
          #   - "DEGENERATE RUN"  the run measured nothing and the harness
          #     refused to score it; the notice names the viewer, question
          #     and ef_search that went dark. Not a recall regression.
          #   - "RUN FAILED"      the measurement phase crashed on something
          #     else (viewer JWT rejected, embedder outage, DB gone). Also
          #     not a recall regression.
          #   - a real recall@5 table  the run measured fine, so a red job
          #     is the --enforce-floor alarm: recall genuinely regressed.
          # A job that dies BEFORE the runner (Supabase start, pip install,
          # seed, timeout kill) publishes neither file, so no <DATE>.md at
          # all points at the step log rather than at the eval.
          # --summary: write to a scratch path, NOT the git-tracked
          # evals/permissions_scale/summary.md default. The publish step
          # copies from here, so what gets committed as today's nightly is
          # by construction something THIS run wrote - and a job that dies
          # before the runner leaves no file to publish at all.
          python -m evals.permissions_scale.runner \
            --out /tmp/scale.json \
            --summary /tmp/scale-summary.md \
            --enforce-floor

      - name: Publish to docs/permissions-scale-nightly/
        # Always publish, even when --enforce-floor failed the previous
        # step — the snapshot is the *evidence* of the failure and is
        # more useful committed than discarded. `if: always()` runs the
        # step when the job has failed, then we let the job's overall
        # exit code reflect the eval's verdict.
        if: always()
        env:
          # PR creation + auto-merge run under the fine-grained PAT, NOT the default
          # GITHUB_TOKEN. A PR opened by GITHUB_TOKEN does not trigger the required
          # check workflows (GitHub blocks recursive runs), so an auto-merging PR
          # opened with it would sit forever waiting on checks that never start.
          # The PAT (Contents + Pull requests read/write) is provisioned by the
          # captain as the EVAL_PUBLISH_TOKEN repo secret; a missing secret fails
          # this step loudly rather than silently falling back to a direct push that
          # the required-checks ruleset on main would reject anyway. This step is
          # if: always(), so it still publishes the evidence snapshot of a
          # floor-breach run - the job stays red from the eval step regardless.
          GH_TOKEN: ${{ secrets.EVAL_PUBLISH_TOKEN }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          mkdir -p docs/permissions-scale-nightly
          # THE PAIR INVARIANT: <DATE>.md and <DATE>.json always describe the
          # SAME run, and a job that never reached the runner never touches the
          # published record at all.
          #
          # Both sources are scratch paths only this run could have written -
          # never the git-tracked in-repo summary - so "the file exists" and
          # "this run produced it" are the same statement.
          #
          # /tmp/scale-summary.md is the discriminator: the runner writes it on
          # every path that reaches a verdict, including a refusal or a crash.
          # So its presence means "this run has something to say about this
          # date", and its absence means the job died before the eval ran
          # (`supabase start`, `pip install`, the seed step, or the 30-minute
          # `timeout-minutes` kill).
          if [ -f /tmp/scale-summary.md ]; then
            cp /tmp/scale-summary.md \
               "docs/permissions-scale-nightly/${DATE}.md"
            # A refused or failed run writes the notice but no results JSON, so
            # any same-date .json still on disk is from a DIFFERENT run - this
            # workflow has `workflow_dispatch`, so a re-dispatch after a healthy
            # cron run would otherwise leave the morning's <DATE>.json beside
            # the afternoon's DEGENERATE <DATE>.md. Reconcile it to this run.
            if [ -f /tmp/scale.json ]; then
              cp /tmp/scale.json "docs/permissions-scale-nightly/${DATE}.json"
            else
              rm -f "docs/permissions-scale-nightly/${DATE}.json"
            fi
          else
            # Publish NOTHING and delete NOTHING. Anything already committed for
            # this date belongs to an earlier run that DID reach a verdict, and
            # deleting half of it here would manufacture the very orphaned pair
            # the invariant above exists to prevent.
            echo "eval never reached a verdict - leaving ${DATE} artifacts untouched"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/permissions-scale-nightly || true
          if git diff --cached --quiet; then
            echo "no changes to commit — nightly produced no artifact"
            exit 0
          fi
          # Publish via an auto-merging docs-only PR instead of a direct push to
          # main. Once the required security-gate checks are enforced on main, a
          # direct push (no PR, no checks) is rejected; a docs-only PR trips those
          # checks as skipped=pass and merges cleanly. The branch name carries the
          # run id + attempt so concurrent / re-run nightlies never collide.
          BRANCH="eval-publish/permissions-scale-${DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git commit -m "chore(evals): permissions scale nightly ${DATE}"
          # Push the commit to a fresh remote branch and rewind local main (below),
          # leaving the checkout clean.
          git push origin "HEAD:refs/heads/${BRANCH}"
          BODY=$(printf '%s\n' \
            "Automated docs-only eval snapshot from the \`Permissions scale eval (nightly)\` workflow (run ${GITHUB_RUN_ID})." \
            '' \
            'Publishes the permissions-scale receipts under `docs/permissions-scale-nightly/` via an auto-merging PR instead of a direct `git push` to `main`, so the required security-gate checks on `main` are satisfied - a docs-only PR trips them as skipped=pass.' \
            '' \
            'Opened with the `EVAL_PUBLISH_TOKEN` fine-grained PAT so the required check workflows run; a PR opened with the default `GITHUB_TOKEN` would not trigger them. Auto-merge (squash) is enabled and it merges once checks pass.')
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(evals): permissions scale nightly ${DATE}" \
            --body "${BODY}")
          gh pr merge --auto --squash --delete-branch "$PR_URL"
          echo "opened auto-merging PR: ${PR_URL}"
          git reset --hard HEAD~1
