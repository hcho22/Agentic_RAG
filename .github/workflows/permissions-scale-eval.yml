# US-043: nightly permissions-scale benchmark.
#
# Runs the wikipedia 10k-chunk corpus + the ef_search sweep across three
# permission selectivities (50% / 10% / 1%). The eval is the empirical
# backing for the HNSW selectivity story in docs/permissions-aware-rag.md
# (US-044). Comment + dashboard rather than blocking PR check — the
# runtime (~3 min seed + ~3 min eval) and the OpenAI embedding cost
# (~$0.10 per seed) make it a nightly job, not a per-PR one.
#
# Failure semantics: the runner is invoked with --enforce-floor, so it
# exits non-zero if recall@5 at (selectivity=1%, ef_search=40) drops
# below the floor configured in scale_gold.yaml::recall_floor. The floor
# is intentionally loose at v0 (0.10) — the recall *collapse* is the
# whole point of the eval, so the alarm is "we still retrieve something",
# not "we retrieve everything". Tighten once three nightlies have run
# and a stable baseline is visible (PRD open question).
#

name: Permissions scale eval (nightly)

on:
  schedule:
    # 03:00 UTC daily — staggered an hour past the retrieval-eval nightly
    # so the two don't compete for the same Supabase docker stack on the
    # GitHub-hosted runner.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  # contents: write - push the nightly snapshot under
  # docs/permissions-scale-nightly/.
  # issues: write - the 'Alarm on stranded eval publish' step files / closes a
  # deduped publish-failure issue when a snapshot cannot be published to main.
  contents: write
  issues: write

concurrency:
  group: permissions-scale-eval-nightly
  cancel-in-progress: false

jobs:
  scale:
    name: Wikipedia 10k + ef_search sweep
    runs-on: ubuntu-latest
    # Budget breakdown: seed ≈ 3 min (HF download + embedding 10k chunks
    # via OpenAI), eval ≈ 3 min (15 questions × 3 viewers × 4 ef_search
    # = 180 RPC calls), plus Supabase boot. 30-minute ceiling leaves
    # plenty of headroom for slow-day OpenAI / HuggingFace.
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint eval-publish app token
        id: eval_publish_app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.EVAL_PUBLISH_APP_ID }}
          private-key: ${{ secrets.EVAL_PUBLISH_APP_PRIVATE_KEY }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evals/permissions_scale/requirements.txt

      - name: Install Supabase CLI
        # Pinned to match local dev + retrieval-eval.yml: an unpinned `latest`
        # drifted to a CLI whose default auth key format breaks the eval
        # runner's self-minted JWTs (403). See retrieval-eval.yml for the full
        # rationale; keep these pins in lockstep.
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Start local Supabase stack
        run: |
          # Brings up pgvector + PostgREST + auth + applies migrations.
          # The HNSW index on chunks.embedding is created by the same
          # migration the production schema uses, so the ef_search knob
          # behaves identically here to a real deployment.
          supabase start
          supabase status -o env > /tmp/supabase.env
          grep -E '^(API_URL|SERVICE_ROLE_KEY|DB_URL)=' /tmp/supabase.env \
            | sed -E 's/^(.*)="(.*)"$/\1=\2/' \
            >> "$GITHUB_ENV"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r evals/permissions_scale/requirements.txt

      - name: Seed wikipedia corpus
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          CORPUS_SEED_DATABASE_URL: ${{ env.DB_URL }}
          DATABASE_URL: ${{ env.DB_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Pinning here so the dataset is reproducible across runs even
          # if Salesforce/wikitext's main branch moves. Bump after the
          # first successful nightly resolves a SHA into the summary.
          WIKITEXT_REVISION: main
        run: |
          python -m db_seed.wikipedia_seed

      - name: Run scale eval
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          CORPUS_SEED_DATABASE_URL: ${{ env.DB_URL }}
          DATABASE_URL: ${{ env.DB_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # --enforce-floor: exit non-zero if the recall_floor cell in
          # scale_gold.yaml drops below threshold. Dataset-fetch / seed
          # errors fall through the `set -e` shell default and also fail
          # the job.
          # The runner has a second, semantically different non-zero exit:
          # it REFUSES a run that produced no signal (blind gold cell,
          # unseeded corpus) and writes a DEGENERATE RUN notice in place
          # of the table.
          #
          # Triaging a red nightly: the discriminator is the NOTICE HEADING
          # in the published <DATE>.md, not the presence or absence of
          # <DATE>.json. Three cases:
          #   - "DEGENERATE RUN"  the run measured nothing and the harness
          #     refused to score it; the notice names the viewer, question
          #     and ef_search that went dark. Not a recall regression.
          #   - "RUN FAILED"      the measurement phase crashed on something
          #     else (viewer JWT rejected, embedder outage, DB gone). Also
          #     not a recall regression.
          #   - a real recall@5 table  the run measured fine, so a red job
          #     is the --enforce-floor alarm: recall genuinely regressed.
          # A job that dies BEFORE the runner (Supabase start, pip install,
          # seed, timeout kill) publishes neither file, so no <DATE>.md at
          # all points at the step log rather than at the eval.
          # --summary: write to a scratch path, NOT the git-tracked
          # evals/permissions_scale/summary.md default. The publish step
          # copies from here, so what gets committed as today's nightly is
          # by construction something THIS run wrote - and a job that dies
          # before the runner leaves no file to publish at all.
          python -m evals.permissions_scale.runner \
            --out /tmp/scale.json \
            --summary /tmp/scale-summary.md \
            --enforce-floor

      - name: Publish to docs/permissions-scale-nightly/
        id: publish
        # Always publish, even when --enforce-floor failed the previous
        # step — the snapshot is the *evidence* of the failure and is
        # more useful committed than discarded. `if: always()` runs the
        # step when the job has failed, then we let the job's overall
        # exit code reflect the eval's verdict.
        if: always()
        env:
          # PR creation + auto-merge run under the eval-publish GitHub App's
          # installation token, NOT the default GITHUB_TOKEN. A PR opened by
          # GITHUB_TOKEN does not trigger the required check workflows (GitHub
          # blocks recursive runs), so an auto-merging PR opened with it would sit
          # forever waiting on checks that never start. The App token is minted
          # fresh each run by the 'Mint eval-publish app token' step (from the
          # EVAL_PUBLISH_APP_ID / EVAL_PUBLISH_APP_PRIVATE_KEY repo secrets the
          # captain provisions), so it never expires the way the old PAT did. That
          # mint step fails loudly if the App secrets are missing/invalid, and the
          # preflight below fails loudly if the token is empty, rather than
          # silently falling back to a direct push the required-checks ruleset on
          # main would reject anyway. This step is if: always(), so it still
          # publishes the evidence snapshot of a floor-breach run - the job stays
          # red from the eval step regardless.
          GH_TOKEN: ${{ steps.eval_publish_app_token.outputs.token }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          mkdir -p docs/permissions-scale-nightly
          # THE PAIR INVARIANT: <DATE>.md and <DATE>.json always describe the
          # SAME run, and a job that never reached the runner never touches the
          # published record at all.
          #
          # Both sources are scratch paths only this run could have written -
          # never the git-tracked in-repo summary - so "the file exists" and
          # "this run produced it" are the same statement.
          #
          # /tmp/scale-summary.md is the discriminator: the runner writes it on
          # every path that reaches a verdict, including a refusal or a crash.
          # So its presence means "this run has something to say about this
          # date", and its absence means the job died before the eval ran
          # (`supabase start`, `pip install`, the seed step, or the 30-minute
          # `timeout-minutes` kill).
          if [ -f /tmp/scale-summary.md ]; then
            cp /tmp/scale-summary.md \
               "docs/permissions-scale-nightly/${DATE}.md"
            # A refused or failed run writes the notice but no results JSON, so
            # any same-date .json still on disk is from a DIFFERENT run - this
            # workflow has `workflow_dispatch`, so a re-dispatch after a healthy
            # cron run would otherwise leave the morning's <DATE>.json beside
            # the afternoon's DEGENERATE <DATE>.md. Reconcile it to this run.
            if [ -f /tmp/scale.json ]; then
              cp /tmp/scale.json "docs/permissions-scale-nightly/${DATE}.json"
            else
              rm -f "docs/permissions-scale-nightly/${DATE}.json"
            fi
          else
            # Publish NOTHING and delete NOTHING. Anything already committed for
            # this date belongs to an earlier run that DID reach a verdict, and
            # deleting half of it here would manufacture the very orphaned pair
            # the invariant above exists to prevent.
            echo "eval never reached a verdict - leaving ${DATE} artifacts untouched"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/permissions-scale-nightly || true
          if git diff --cached --quiet; then
            echo "no changes to commit — nightly produced no artifact"
            exit 0
          fi
          # Publish via an auto-merging docs-only PR instead of a direct push to
          # main. Once the required security-gate checks are enforced on main, a
          # direct push (no PR, no checks) is rejected; a docs-only PR trips those
          # checks as skipped=pass and merges cleanly. The branch name carries the
          # run id + attempt so concurrent / re-run nightlies never collide.
          BRANCH="eval-publish/permissions-scale-${DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Record the branch for the 'Alarm on stranded eval publish' step so a
          # failure below names the exact branch the snapshot is stranded on.
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git commit -m "chore(evals): permissions scale nightly ${DATE}"
          # Push the commit to a fresh remote branch and rewind local main (below),
          # leaving the checkout clean.
          git push origin "HEAD:refs/heads/${BRANCH}"
          # Named-cause preflight: `gh pr create` authenticates with GH_TOKEN =
          # the minted eval-publish App token. If the mint step yielded an empty
          # token (missing/invalid App secrets) gh would die with the opaque "gh:
          # ... set the GH_TOKEN environment variable" (exit 4). Fail here with a
          # legible cause instead; the 'Alarm on stranded eval publish' step turns
          # it into a visible issue.
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error title=Permissions-scale snapshot NOT published - eval-publish App token is empty::The ${DATE} permissions-scale snapshot was committed and pushed to \`${BRANCH}\` but no auto-merging PR was opened, so it is stranded there, unpublished to main. Ensure the EVAL_PUBLISH_APP_ID / EVAL_PUBLISH_APP_PRIVATE_KEY repo secrets (the eval-publish GitHub App) are set and valid, then re-run."
            exit 1
          fi
          BODY=$(printf '%s\n' \
            "Automated docs-only eval snapshot from the \`Permissions scale eval (nightly)\` workflow (run ${GITHUB_RUN_ID})." \
            '' \
            'Publishes the permissions-scale receipts under `docs/permissions-scale-nightly/` via an auto-merging PR instead of a direct `git push` to `main`, so the required security-gate checks on `main` are satisfied - a docs-only PR trips them as skipped=pass.' \
            '' \
            'Opened with the eval-publish GitHub App installation token so the required check workflows run; a PR opened with the default `GITHUB_TOKEN` would not trigger them. Auto-merge (squash) is enabled and it merges once checks pass.')
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(evals): permissions scale nightly ${DATE}" \
            --body "${BODY}")
          gh pr merge --auto --squash --delete-branch "$PR_URL"
          echo "opened auto-merging PR: ${PR_URL}"
          git reset --hard HEAD~1

      # A red scheduled run alone is exactly what failed to alert anyone when the
      # expiring publish PAT lapsed on 2026-08-12: the failure went
      # unnoticed for a week while nights of receipts piled up on stranded push
      # branches and `main` froze. Moving to a fresh-minted GitHub App token ends
      # that expiry class, but any publish failure must still be impossible to
      # miss. File a deduped, visible issue whenever the publish step above fails,
      # and auto-close it once a run publishes cleanly again. Runs under the
      # default GITHUB_TOKEN - never the minted eval-publish App token - so it can
      # file the alarm even when the App credentials are precisely what is missing;
      # it never pushes. It never fails the job on its own: a floor-breach
      # run is already red from the eval step, and a clean publish must stay green.
      - name: Alarm on stranded eval publish
        if: always() && steps.publish.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STRANDED_BRANCH: ${{ steps.publish.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Resolve open issues via the REST issues endpoint, NOT `gh issue list
          # --label`: the GraphQL search index it queries is only eventually
          # consistent and has silently dropped freshly-labelled issues (see the
          # weekly workflows' harness-failure steps), which would wedge a false
          # alarm open. `?labels=` filters the primary store and is strongly
          # consistent; drop anything with a `pull_request` key (a PR is an issue
          # in this API) so a same-labelled PR is never mistaken for the finding.
          open_issue_numbers() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?labels=$1&state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | .number'
          }
          LABEL=permissions-scale-publish-failure
          gh label create "${LABEL}" --color B60205 \
            --description "Permissions-scale nightly snapshot failed to publish to main" --force || true
          if [ "${PUBLISH_OUTCOME}" = "failure" ]; then
            # A transient gh blip yields empty here, so err toward filing a
            # possibly-duplicate (self-healing) issue rather than leaving the alarm
            # unshouted (invariant 12: the path that should shout must not go quiet).
            existing=$(open_issue_numbers "${LABEL}" || true)
            if [ -z "${existing}" ]; then
              gh issue create --label "${LABEL}" \
                --title "Permissions-scale nightly: snapshot failed to publish to main" \
                --body "$(printf '%s\n' \
                  "The \`Permissions scale eval (nightly)\` publish step failed, so today's snapshot was NOT published to \`main\`." \
                  "" \
                  "The most common cause is a failed mint of the eval-publish GitHub App token that \`gh pr create\` authenticates with - missing or invalid \`EVAL_PUBLISH_APP_ID\` / \`EVAL_PUBLISH_APP_PRIVATE_KEY\` repo secrets. Check the publish step's log for the \`::error::\` line naming the cause." \
                  "" \
                  "Stranded branch: \`${STRANDED_BRANCH:-<not pushed - the publish step failed before creating the branch>}\`" \
                  "" \
                  "Fix: ensure the \`EVAL_PUBLISH_APP_ID\` / \`EVAL_PUBLISH_APP_PRIVATE_KEY\` repo secrets (the eval-publish GitHub App, installed on this repo with Contents + Pull requests read/write) are set and valid, then re-run. A re-run publishes from its own fresh branch; delete any stranded branch once its snapshot has landed on main." \
                  "" \
                  "Run log: ${RUN_URL}" \
                  "" \
                  "This issue is deduped on the \`${LABEL}\` label and auto-closes as soon as a run publishes cleanly again.")" || true
              echo "filed publish-failure issue"
            else
              echo "open publish-failure issue already exists - dedup, skipping"
            fi
          else
            # Publish succeeded (or was a clean no-op): the mechanism is healthy, so
            # retract any open publish-failure alarm. Non-fatal throughout - a
            # transient gh blip here must not turn a healthy publish red.
            for num in $(open_issue_numbers "${LABEL}" || true); do
              gh issue close "${num}" \
                --comment "Auto-closed: the permissions-scale nightly published cleanly again (${RUN_URL})." || true
              echo "auto-closed publish-failure issue #${num}"
            done
          fi

      # Complements the 'Alarm on stranded eval publish' step above, which only
      # fires on steps.publish.outcome == 'failure'. But the publish step is
      # if: always(), so on a mint-step failure (missing/invalid
      # EVAL_PUBLISH_APP_ID / EVAL_PUBLISH_APP_PRIVATE_KEY) or any setup abort
      # before the eval - supabase start, pip install, the seed, a timeout kill -
      # it runs as a clean no-op (nothing to commit) and exits 0: the stranded
      # alarm then sees a success and files nothing, even though the job is red.
      # Without this step that red run would file no issue - the exact silent-
      # failure class the PR #112 guarantee exists to prevent. File a deduped,
      # visible harness-failure issue when the job failed WITHOUT producing a
      # publishable snapshot, and auto-close it once a run publishes again. Runs
      # under the default GITHUB_TOKEN - never the minted App token - so it can file
      # even when the App credentials are precisely what is missing; it never
      # pushes and never fails the job on its own.
      - name: Alarm on eval harness failure
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PUBLISH_BRANCH: ${{ steps.publish.outputs.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # REST issues endpoint, not `gh issue list --label` (the GraphQL search
          # index is only eventually consistent and has silently dropped freshly-
          # labelled issues; see the weekly workflows' harness-failure steps). Drop
          # PRs.
          open_issue_numbers() {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?labels=$1&state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null) | .number'
          }
          LABEL=permissions-scale-harness-failure
          gh label create "${LABEL}" --color B60205 \
            --description "Permissions-scale nightly aborted before it could publish a snapshot" --force || true
          # The job aborted AND the publish step committed nothing (no branch
          # recorded): it died before producing a publishable snapshot. A
          # job-level timeout-minutes kill surfaces as job.status 'cancelled'
          # (not 'failure'), so both are treated as a harness abort - otherwise a
          # timeout-kill would fall into the close branch and silently retract an
          # open alarm (invariant 12: the path that should shout must not go
          # quiet). A floor-breach run still commits its evidence snapshot and
          # records a branch, so it is measured, NOT a harness failure, and lands
          # in the close branch below.
          if { [ "${JOB_STATUS}" = "failure" ] || [ "${JOB_STATUS}" = "cancelled" ]; } && [ -z "${PUBLISH_BRANCH}" ]; then
            # A transient gh blip yields empty here, so err toward filing a
            # possibly-duplicate (self-healing) issue rather than leaving the alarm
            # unshouted (invariant 12: the path that should shout must not go quiet).
            existing=$(open_issue_numbers "${LABEL}" || true)
            if [ -z "${existing}" ]; then
              gh issue create --label "${LABEL}" \
                --title "Permissions-scale nightly: harness aborted before publishing a snapshot" \
                --body "$(printf '%s\n' \
                  "The \`Permissions scale eval (nightly)\` job failed BEFORE the eval produced a publishable snapshot, so the publish step was a no-op and the 'Alarm on stranded eval publish' step saw a success and filed nothing." \
                  "" \
                  "The most common cause is a failed mint of the eval-publish GitHub App token - missing or invalid \`EVAL_PUBLISH_APP_ID\` / \`EVAL_PUBLISH_APP_PRIVATE_KEY\` repo secrets - but any setup abort (supabase start, pip install, the seed step, or the timeout kill) lands here too. Check the earliest failing step's log." \
                  "" \
                  "Fix: ensure the \`EVAL_PUBLISH_APP_ID\` / \`EVAL_PUBLISH_APP_PRIVATE_KEY\` repo secrets (the eval-publish GitHub App, installed on this repo with Contents + Pull requests read/write) are set and valid, or address the failing setup step, then re-run." \
                  "" \
                  "Run log: ${RUN_URL}" \
                  "" \
                  "This issue is deduped on the \`${LABEL}\` label and auto-closes as soon as a run publishes a snapshot again.")" || true
              echo "filed harness-failure issue"
            else
              echo "open harness-failure issue already exists - dedup, skipping"
            fi
          else
            # The run reached a publishable verdict (or is healthy): retract any open
            # harness-failure alarm. Non-fatal throughout - a transient gh blip here
            # must not turn a healthy run red.
            for num in $(open_issue_numbers "${LABEL}" || true); do
              gh issue close "${num}" \
                --comment "Auto-closed: the permissions-scale nightly produced a publishable snapshot again (${RUN_URL})." || true
              echo "auto-closed harness-failure issue #${num}"
            done
          fi
