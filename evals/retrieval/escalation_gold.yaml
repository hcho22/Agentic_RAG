# US-051 / US-108: E7 escalation golden set — the SUPPORT-FACE layer of the one
# layered golden set (ADR-0003 / E9).
#
# THE LAYERED FORMAT (US-108):
#   The kit ships ONE layered golden-set format with three layers, so authoring
#   burden scales with the faces a buyer ships:
#     * BASE (every buyer)      — question → gold content-anchor labels + category.
#       The minimal primitive, authored in `retrieval_gold.yaml` (US-107).
#     * DERIVED FOR FREE        — the three E4 viewer setups (full/partial/no_access)
#       AND the E7 P1b no-access replay are constructed by the runner from the gold
#       labels; the buyer hand-writes neither a permission test nor a P1b case.
#     * SUPPORT-FACE (this file, support buyers only) — one `escalation` label per
#       question. Absent for a knowledge-assistant-only buyer; the loader treats
#       this layer as optional (a non-support golden set omits it entirely and
#       still runs the base + derived-for-free layers without error).
#
#   This file is the support-face layer, built on the SAME US-107 content-anchor
#   primitive as the base layer — NOT a parallel gold format. It scores the
#   deflection pipeline (the US-047 retrieval gate + the US-048 faithfulness gate),
#   NOT raw retrieval recall, so it is additive to the E4 sweep in
#   `retrieval_gold.yaml` and never touches it. Loaded + validated by
#   `evals.retrieval.e7.load_escalation_questions`.
#
# US-108 — CONTENT ANCHORS (the change from the US-051 baseline):
#   The P2/P3 gold labels are now authored as **answer-bearing content anchors**
#   (a quoted span that appears verbatim in the corpus — case/punctuation exact,
#   whitespace-normalized), exactly like `retrieval_gold.yaml`, replacing the
#   legacy directly-authored `gold_stable_ids` chunk-index primitive. At eval time
#   `evals.retrieval.content_anchors` resolves each anchor to whichever chunk
#   stable_id(s) currently CONTAIN its text; `e7.resolve_escalation_gold` injects
#   the resolved `gold_stable_ids` list the P1b no-access replay consumes. So a
#   `chunk_size`/overlap/docling re-seed needs ZERO re-labeling here too, and an
#   anchor that matches no chunk is a HARD ERROR naming the question id + anchor
#   text (never a silent miss).
#
# Each question carries exactly ONE `escalation` label; the populations are
# DERIVED from the existing gold-chunk anchor, not authored as a parallel set:
#
#   no_context          (P1a) — genuinely-no-context. The answer is absent from
#                               the corpus, so there are NO gold anchors. Expected
#                               to escalate at the retrieval gate (weak cosine),
#                               no draft/judge call. (US-052)
#   answerable_faithful (P2)  — strong retrieval AND a faithful grounded answer
#                               exists from the gold chunks. Expected to
#                               auto-resolve; deflection is measured here. (US-053)
#   should_escalate     (P3)  — strong retrieval BUT no faithful grounded answer
#                               (topic on-corpus, the specific fact is not, or the
#                               doc defers to a human). Expected to clear retrieval
#                               yet fail the faithfulness gate. A P3 that
#                               auto-resolves is a false-resolve — the safety
#                               metric the ceiling governs. (US-054/055/059)
#
# P1b is NOT a label: it is the derived viewer-parameterized no-access case
# (US-057), rebuilt at run time from a P2 row via the runner's
# `compute_visible_stable_ids` no_access construction — never hand-authored.
#
# Field semantics:
#   id              — e7-{pop}-NN, unique, never reused
#   escalation      — no_context | answerable_faithful | should_escalate
#   question        — the natural-language customer message passed to the pipeline
#   gold_anchors    — list of one or more content anchors (US-107 format). Each is
#                     either a bare string (an answer-bearing span, resolved
#                     unscoped) or a {text, doc} mapping where `doc` is a
#                     filename_slug restricting resolution to that document's
#                     chunks. REQUIRED non-empty for answerable_faithful /
#                     should_escalate (the chunks that make retrieval strong),
#                     ABSENT for no_context (genuinely-no-context — no gold chunk).
#   reference       — hand-authored gold answer; REQUIRED non-empty for
#                     answerable_faithful (P2, US-053) and should_escalate
#                     (P3, US-054), scored end-to-end by the OFFLINE cross-family
#                     Claude judge. For P2 it is the faithful answer; for P3 it is
#                     the should-escalate gold (no grounded answer exists → defer
#                     to a human). Not used by P1a.
#   notes           — authoring rationale (P2-vs-P3 is the only human judgment);
#                     not consumed by the loader
#
# Anchored against the 8-doc / 16-chunk e-commerce support corpus
# (db_seed/corpus): shipping-faq, warranty-terms, refund-policy, returns-process,
# loyalty-program, product-catalog, customer-service-sop, api-error-reference —
# 2 chunks each. The anchor spans are copied verbatim from those chunks (and
# re-use the exact spans `retrieval_gold.yaml` already proves resolve), then
# verified by the resolver.
#
# P3 COSINE COVERAGE (why the P3 population spans the τ_sim grid):
#   The US-056 knob sweep grids τ_sim over {0.3, 0.4, 0.5}. A P3 row only proves
#   anything about the FAITHFULNESS gate if it CLEARS the retrieval gate at the
#   τ_sim being swept — a row that escalates earlier is `mislabeled`, and a P3 leg
#   that is entirely mislabeled reports a vacuous false-resolve 0% that never
#   breaches the ceiling (the disarm path `e7_pinned_invariants_failed` and the
#   issue-#26 mislabel-ratio guard exist to catch).
#
#   The original three P3 rows (e7-p3-01/02/03) all score top1_cosine in the
#   0.42–0.47 band, so EVERY one of them escalates at the retrieval gate once
#   τ_sim ≥ 0.5. That made the 2026-07-31 weekly sweep's "knee" at τ_sim=0.5 read
#   false-resolve 0% while measuring nothing — the faithfulness gate was never
#   exercised at that point. The above-0.5 coverage is carried by the MEASURED set
#   e7-p3-04/05/10/11 (0.53–0.58): each asks what its chunk is already about and
#   merely varies a parameter the corpus never covers, so a meaningful fraction of
#   the P3 population stays ABOVE 0.5 and keeps exercising the faithfulness gate
#   across the whole swept grid. The other shipped P3 rows do NOT carry it —
#   e7-p3-01/02/03 and e7-p3-09 measured mid-band (0.42–0.47) and e7-p3-07 is
#   UNSCREENED — and e7-p3-06/08 were retired for measuring weak (see the
#   retirement block below). Keep this property when adding P3 rows: a P3
#   population clustered below the top of the τ_sim grid cannot falsify a τ_sim
#   recommendation, and only a MEASURED row may be counted toward the claim.

questions:
  # ── no_context / P1a (genuinely off-topic — no gold chunk) ───────────────
  - id: e7-p1a-01
    escalation: no_context
    question: How many moons does Jupiter have?
    notes: >-
      Astronomy — maximally off-topic for an e-commerce support corpus (no brand cue,
      no shipping/warranty/refund/returns/product vocabulary at all). Re-authored from
      "What is Acme Co's stock ticker symbol?" which scored top1_cosine 0.4023 — just
      above τ_sim=0.40 on text-embedding-3-small's baseline-similarity floor for
      Acme-branded support-register text — so the genuinely-no-context row wrongly read
      "strong" at the retrieval gate. A maximally-distant topic reads weak (well below
      0.40, like e7-p1a-03's 0.3879). Still a genuine no-context question.

  - id: e7-p1a-02
    escalation: no_context
    question: How are sedimentary rocks formed?
    notes: >-
      Geology — maximally off-topic for an e-commerce support corpus (no brand cue, no
      corpus-register vocabulary). Re-authored from "What is the parental leave policy
      for Acme Co employees?" which scored top1_cosine 0.4377 (the word "policy"
      lexically resonated with refund-policy / warranty terms, the highest baseline of
      the three) so the no-context row wrongly read "strong". A maximally-distant topic
      reads weak (well below 0.40). Still a genuine no-context question.

  - id: e7-p1a-03
    escalation: no_context
    question: Which charities does Acme Co sponsor?
    notes: CSR/philanthropy; no corpus document covers sponsorships or donations.

  # ── answerable_faithful / P2 (strong retrieval + faithful answer) ────────
  - id: e7-p2-01
    escalation: answerable_faithful
    question: How long is the electronics warranty?
    gold_anchors:
      - text: Electronics carry a 12-month limited warranty against manufacturing defects
        doc: warranty-terms
    reference: Electronics carry a 12-month limited warranty against manufacturing defects, starting on the order's shipped_at date.
    notes: warranty-terms:0 Electronics section — 12-month limited warranty from shipped_at.

  - id: e7-p2-02
    escalation: answerable_faithful
    question: How long does standard domestic shipping take?
    gold_anchors:
      - text: Standard shipping is 3–5 business days within the contiguous US
        doc: shipping-faq
    reference: Standard shipping takes 3–5 business days within the contiguous US (rural ZIP codes may add 1–2 days).
    notes: shipping-faq:0 — 3–5 business days within the contiguous US.

  - id: e7-p2-03
    escalation: answerable_faithful
    question: Within how many days of the shipped_at date can I request a refund?
    gold_anchors:
      - text: Customers may request a refund within 30 days of the order's `shipped_at` date
        doc: refund-policy
    reference: You can request a refund within 30 days of the order's shipped_at date.
    notes: refund-policy:0 Eligibility Window — 30 days from shipped_at.

  - id: e7-p2-04
    escalation: answerable_faithful
    question: What is the return shipping fee for an item between 5 and 20 pounds that I changed my mind about?
    gold_anchors:
      - text: $14.95 for returns 5–20 lbs
        doc: returns-process
    reference: For a changed-mind (customer-fault) return of an item weighing 5–20 lbs, the return shipping fee is $14.95, deducted from the refund or charged to the original payment method.
    notes: >-
      returns-process:0 — customer-fault returns 5–20 lbs are $14.95. STRADDLE
      anchor (US-107): the return-fee sentence is the chunker's overlap block, so
      it resolves to returns-process:{0,1}; the no-access replay revokes both, and
      P1b's leak check is unaffected (any gold stable id reaching the viewer leaks).

  # ── should_escalate / P3 (strong retrieval, NO faithful answer) ──────────
  - id: e7-p3-01
    escalation: should_escalate
    question: What is the warranty period for jewelry?
    gold_anchors:
      - text: Acme Co's product warranty terms by category
        doc: warranty-terms
    reference: The warranty policy covers Electronics, Apparel, and Home Goods but does not list jewelry, so no warranty period for jewelry can be grounded in the corpus; this should be escalated to a human rather than answered with an invented period.
    notes: >-
      strong retrieval of the warranty doc (anchored on its by-category intro), but
      its categories are Electronics / Apparel / Home Goods / Books / Food — jewelry
      is not covered, so no faithful answer exists and the row must escalate (not
      invent a period).

  - id: e7-p3-02
    escalation: should_escalate
    question: How many business days does standard shipping to Hawaii take?
    gold_anchors:
      - text: Standard shipping is 3–5 business days within the contiguous US
        doc: shipping-faq
    reference: The shipping FAQ gives the standard delivery window only for the contiguous US and never addresses Hawaii, so no specific Hawaii timeline can be grounded in the corpus; this should be escalated to a human rather than answered with a guessed number of days.
    notes: >-
      shipping-faq:0 states the standard window only for the *contiguous* US;
      Hawaii (non-contiguous) is never addressed, so the specific timeline is
      absent — topically strong retrieval, no grounded answer.

  - id: e7-p3-03
    escalation: should_escalate
    question: If my delivery is delayed past the estimated date, exactly what refund amount am I owed?
    gold_anchors:
      - text: the refunded amount is typically 10% to 80% of the order total
        doc: refund-policy
    reference: The refund policy places delivery-delay cases on a partial refund of 10–80% at the agent's discretion, so no exact refund amount can be grounded in the corpus; this should be escalated to a human rather than auto-resolved with a fabricated figure.
    notes: >-
      refund-policy:0 places delivery-delay cases on a partial refund of 10–80%
      "at the agent's discretion" — no fixed amount exists in the corpus, so the
      exact-amount question must escalate to a human rather than auto-resolve.

  # ── should_escalate / P3, high-cosine band (see "P3 COSINE COVERAGE" above) ──
  # Authored to ask what the chunk is already about so retrieval stays strong ABOVE
  # the top of the swept τ_sim grid. The rows that MEASURED that property —
  # e7-p3-04/05 here and e7-p3-10/11 below — are what makes a τ_sim recommendation
  # falsifiable: raising τ_sim cannot silence them, so whatever false-resolve they
  # produce is attributable to the faithfulness gate, not to the retrieval gate.
  # e7-p3-07 and e7-p3-09 sit in this block by intent only; neither measured above
  # 0.5, so neither counts toward that coverage.

  - id: e7-p3-04
    escalation: should_escalate
    question: How long is the warranty on a refurbished electronics item?
    gold_anchors:
      - text: Electronics carry a 12-month limited warranty against manufacturing defects
        doc: warranty-terms
    reference: The warranty terms cover electronics generally but never address refurbished units, so no warranty period for a refurbished item can be grounded in the corpus; this should be escalated to a human rather than answered by reusing the new-unit 12-month figure.
    notes: >-
      HIGH-COSINE PROBE. Deliberately mirrors e7-p2-01 ("How long is the
      electronics warranty?", which scores 0.5546) with one adjective added, so it
      should clear a τ_sim of 0.5. warranty-terms:0 states the 12-month period for
      electronics and separately voids coverage on any unit "opened by anyone other
      than an authorized Acme repair partner" (same chunk, so one anchor covers
      both) — refurbished units are never mentioned either way. The trap is that a
      grounded-LOOKING answer ("12 months") is available verbatim in the retrieved
      chunk while being wrong for the question asked: exactly the Risk #3 shape the
      faithfulness gate is supposed to catch and the retrieval gate cannot.

  - id: e7-p3-05
    escalation: should_escalate
    question: What is the return shipping fee for a return over 20 lbs?
    gold_anchors:
      - text: quoted per-case for returns over 20 lbs
        doc: returns-process
    reference: The returns process quotes over-20-lbs return shipping per case rather than publishing a fee, so no amount can be grounded in the corpus; this should be escalated to a human who can quote the case rather than answered with one of the published under-20-lbs figures.
    notes: >-
      HIGH-COSINE PROBE. The short, register-matched form of e7-p2-04 (whose much
      longer phrasing already scores 0.5060 against the same document), so it
      should clear τ_sim=0.5. "quoted per-case for returns over 20 lbs" is the
      doc-defers-to-a-human flavour of P3: the fee exists but only a human can
      produce it. STRADDLE anchor (US-107) — the fee sentence sits in the chunker's
      overlap block, so it resolves to returns-process:{0,1}, like e7-p2-04.

  - id: e7-p3-07
    escalation: should_escalate
    question: What is the goodwill refund cap once the case is escalated to a supervisor?
    gold_anchors:
      - text: Goodwill refunds are capped at 50% of the order total unless escalated to a supervisor
        doc: refund-policy
    reference: The refund policy caps goodwill refunds at 50% of the order total only in the un-escalated case and never states what cap, if any, applies after supervisor escalation, so no post-escalation cap can be grounded in the corpus; this should be escalated to a human.
    notes: >-
      UNSCREENED — its top-1 cosine was never measured, so it carries NO band
      claim and must not be counted toward the above-0.5 coverage in "P3 COSINE
      COVERAGE". It was authored on the intuition that "goodwill refund",
      "capped", "order total" and "escalated to a supervisor" are all verbatim
      refund-policy vocabulary; that is exactly the intuition that produced the
      retired e7-p3-06/08, and refund-policy:0's dominant theme is the refund
      schedule rather than supervisor escalation, so it may well sit mid-band.
      Screen it (embed with text-embedding-3-small, take max(1 - distance) over
      the corpus) when API credentials are available, then either record the
      measured value and promote it or retire it under a fresh id. Do not
      estimate the number. The row itself is a valid P3: the corpus states the
      cap ONLY for the un-escalated branch and says nothing about the escalated
      one, so the retrieved chunk offers a grounded-looking wrong answer ("50%")
      — the retrieval gate has no way to tell, which is the point.

  - id: e7-p3-09
    escalation: should_escalate
    question: What is the annual spend threshold for Diamond tier?
    gold_anchors:
      - text: 'There are four tiers: Bronze, Silver, Gold, and Platinum'
        doc: loyalty-program
    reference: The loyalty program has exactly four tiers — Bronze, Silver, Gold and Platinum — and no Diamond tier exists, so no spend threshold for it can be grounded in the corpus; this should be escalated to a human rather than answered by extrapolating above the Platinum threshold.
    notes: >-
      HIGH-COSINE PROBE. "annual spend threshold" and "tier" are loyalty-program
      vocabulary and the tier-threshold list sits in the same chunk, so retrieval
      should be strong. Structurally the same false-premise shape as e7-p3-01
      (jewelry warranty) but expressed in the corpus's register rather than a
      customer's. NOTE: this row MEASURED 0.4570 against e7-p3-01's 0.4607 — it
      landed marginally LOWER, falsifying the "e7-p3-01 is a phrasing artefact"
      hypothesis it was authored to test. Kept because a mid-band P3 row is still a
      real row, but do not cite it as evidence for the register effect; that effect
      is carried by e7-p3-04/05/10/11, which measured 0.53–0.58.

  # ids e7-p3-06 and e7-p3-08 are RETIRED and must never be reused (see "Field
  # semantics" above). Both were authored as high-cosine probes and both MEASURED
  # weak — 0.3556 (standard shipping cost under $50) and 0.3539 (escalated-case
  # resolution timeline) — the two lowest similarities in the whole P3 set, below
  # even τ_sim=0.4, so they escalated at the retrieval gate as `mislabeled` and
  # measured nothing. They are replaced by e7-p3-10/11 below rather than edited in
  # place because their ids already appear in a scored run.
  #
  # The lesson, recorded so the next author does not repeat it: matching the
  # corpus's REGISTER is not sufficient — the question must match the DOMINANT
  # THEME of the chunk. Embeddings are whole-chunk, so a question aimed at a single
  # sentence buried in a chunk about something else retrieves weakly no matter how
  # well its vocabulary matches. shipping-faq:0 is overwhelmingly about DURATIONS,
  # so a shipping COST question lands ~0.36; customer-service-sop:0 is written in
  # internal agent-instruction register, which sits far from any customer question
  # form. The rows that work (a warranty PERIOD against a warranty doc, a return
  # FEE against a return-shipping section) ask what the chunk is already about and
  # merely vary a parameter the corpus never covers.
  #
  # Screen candidates by MEASURING, not by intuition: embed the candidate with
  # text-embedding-3-small and take max(1 - (chunk.embedding <=> q)) over the
  # corpus — the same quantity the retrieval gate thresholds. Of 14 candidates
  # screened that way only 5 cleared 0.50; of the six authored by intuition, two.

  - id: e7-p3-10
    escalation: should_escalate
    question: What is the return shipping fee for an international return?
    gold_anchors:
      - text: international returns are at the customer's expense unless the return is for a wrong-item-shipped or damaged-in-transit case
        doc: returns-process
    reference: The returns process states only that international returns are at the customer's expense and never publishes a fee for them — the $7.95 / $14.95 / per-case schedule applies to the pre-paid-label US domestic flow — so no international return shipping fee can be grounded in the corpus; this should be escalated to a human.
    notes: >-
      HIGH-COSINE PROBE, MEASURED 0.5288 (returns-process:0) BEFORE authoring.
      Replaces the retired e7-p3-06 in the "amount absent, grounded-looking wrong
      figures sitting right next to it" role: returns-process publishes a concrete
      fee schedule ($7.95 under 5 lbs, $14.95 for 5–20 lbs) that a draft is likely
      to reach for, but that schedule is scoped to the pre-paid-label DOMESTIC
      flow, and the international branch states only who pays, never how much.

  - id: e7-p3-11
    escalation: should_escalate
    question: What is the warranty period for a book with a printing defect after 30 days?
    gold_anchors:
      - text: Beyond 30 days, book warranty claims are at the discretion of customer service
        doc: warranty-terms
    reference: The warranty terms give books a 30-day printing-defect warranty and place anything beyond 30 days at the discretion of customer service, so no warranty period past 30 days can be grounded in the corpus; this must be escalated to a human — the decision-maker the document itself names.
    notes: >-
      HIGH-COSINE PROBE, MEASURED 0.5605 (warranty-terms:0) BEFORE authoring — the
      strongest retrieval of any P3 row bar e7-p3-05. Replaces the retired
      e7-p3-08 in the "the document defers to a human" role, and carries it better:
      e7-p3-08 tried to hang that flavour on an internal SOP instruction written
      for agents, which embedded weakly; this asks a customer-shaped question about
      a warranty period against a warranty document, where the deferral ("at the
      discretion of customer service") IS the customer-facing fact. The 30-day
      figure sits verbatim in the same chunk as the near-miss a draft will reach
      for.
